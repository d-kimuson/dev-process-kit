engineStrict: true

# Keep new dependencies on an exact version, and wait out freshly published
# releases before adopting them (supply-chain hygiene).
saveExact: true
minimumReleaseAge: 1440

allowBuilds:
  esbuild: true
  # agent-browser / lefthook install their platform binaries in postinstall.
  agent-browser: true
  lefthook: true
