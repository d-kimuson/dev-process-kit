<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>User Story Mapping — Sora Market | dev-process-kit</title>
    <!--
      The framework is served from `dist/` by the dev asset server (`pnpm dev`), not
      by this page's own origin: the sample server is a separate origin on purpose,
      so the cross-origin (CORS) load is exercised locally too. A generated page
      loads the same files from jsDelivr instead.
    -->
    <script type="module" src="https://dev-process-kit.localhost/templates/usm.js"></script>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #ffffff;
      }
      dpk-template-usm {
        display: block;
        height: 100dvh;
      }
    </style>
  </head>
  <body>
    <dpk-template-usm storage-key="sample-usm-sora-market">
      <script type="application/json">
        {
          "title": "Sora Market — 購入者のストーリーマップ",
          "activities": [
            {
              "id": "discover",
              "name": "商品を探す",
              "steps": [
                {
                  "id": "search",
                  "name": "検索する"
                },
                {
                  "id": "product-detail",
                  "name": "商品を比べる"
                }
              ]
            },
            {
              "id": "cart",
              "name": "カートに入れる",
              "steps": [
                {
                  "id": "add-to-cart",
                  "name": "カートに追加する"
                },
                {
                  "id": "edit-cart",
                  "name": "カートを見直す"
                }
              ]
            },
            {
              "id": "order",
              "name": "注文する",
              "steps": [
                {
                  "id": "delivery",
                  "name": "届け先を決める"
                },
                {
                  "id": "review",
                  "name": "注文を確定する"
                }
              ]
            },
            {
              "id": "pay",
              "name": "支払う",
              "steps": [
                {
                  "id": "payment-method",
                  "name": "支払い方法を選ぶ"
                },
                {
                  "id": "authorize",
                  "name": "決済を完了する"
                }
              ]
            },
            {
              "id": "receive",
              "name": "受け取る",
              "steps": [
                {
                  "id": "track",
                  "name": "配送状況を確かめる"
                },
                {
                  "id": "delivered",
                  "name": "商品を受け取る"
                }
              ]
            },
            {
              "id": "manage",
              "name": "注文を管理する",
              "steps": [
                {
                  "id": "history",
                  "name": "注文履歴を見る"
                },
                {
                  "id": "cancel",
                  "name": "注文をキャンセルする"
                },
                {
                  "id": "refund",
                  "name": "返金を確かめる"
                }
              ]
            }
          ],
          "milestones": [
            {
              "id": "mvp",
              "name": "MVP"
            },
            {
              "id": "v1",
              "name": "v1"
            },
            {
              "id": "v2",
              "name": "v2"
            }
          ],
          "stories": [
            {
              "id": "keyword-search",
              "name": "キーワードで商品を探す",
              "activityId": "discover",
              "stepId": "search",
              "milestoneId": "mvp"
            },
            {
              "id": "category-browse",
              "name": "カテゴリから絞り込む",
              "activityId": "discover",
              "stepId": "search",
              "milestoneId": "v1"
            },
            {
              "id": "see-stock",
              "name": "在庫の有無を見て選ぶ",
              "description": "在庫切れは購入ボタンを出さない",
              "activityId": "discover",
              "stepId": "product-detail",
              "milestoneId": "mvp"
            },
            {
              "id": "read-reviews",
              "name": "レビューを読んで比べる",
              "activityId": "discover",
              "stepId": "product-detail",
              "milestoneId": "v2"
            },
            {
              "id": "add-item",
              "name": "商品をカートに入れる",
              "activityId": "cart",
              "stepId": "add-to-cart",
              "milestoneId": "mvp"
            },
            {
              "id": "change-quantity",
              "name": "数量を変える・外す",
              "activityId": "cart",
              "stepId": "edit-cart",
              "milestoneId": "mvp"
            },
            {
              "id": "keep-cart",
              "name": "ログインし直してもカートが残る",
              "activityId": "cart",
              "stepId": "edit-cart",
              "milestoneId": "v1"
            },
            {
              "id": "enter-address",
              "name": "届け先住所を入力する",
              "activityId": "order",
              "stepId": "delivery",
              "milestoneId": "mvp"
            },
            {
              "id": "saved-address",
              "name": "登録済みの住所から選ぶ",
              "activityId": "order",
              "stepId": "delivery",
              "milestoneId": "v1"
            },
            {
              "id": "confirm-order",
              "name": "内容を確認して注文を確定する",
              "description": "確定時に在庫を引き当てる",
              "activityId": "order",
              "stepId": "review",
              "milestoneId": "mvp"
            },
            {
              "id": "order-mail",
              "name": "注文確認メールを受け取る",
              "activityId": "order",
              "stepId": "review",
              "milestoneId": "mvp"
            },
            {
              "id": "pay-card",
              "name": "クレジットカードで払う",
              "activityId": "pay",
              "stepId": "payment-method",
              "milestoneId": "mvp"
            },
            {
              "id": "pay-convenience",
              "name": "コンビニ払いを選ぶ",
              "activityId": "pay",
              "stepId": "payment-method",
              "milestoneId": "v2"
            },
            {
              "id": "payment-failed",
              "name": "決済に失敗したら別の方法でやり直す",
              "activityId": "pay",
              "stepId": "authorize",
              "milestoneId": "v1"
            },
            {
              "id": "shipping-status",
              "name": "配送状況を注文詳細で見る",
              "activityId": "receive",
              "stepId": "track",
              "milestoneId": "v1"
            },
            {
              "id": "shipped-mail",
              "name": "出荷のお知らせを受け取る",
              "activityId": "receive",
              "stepId": "track",
              "milestoneId": "mvp"
            },
            {
              "id": "receive-item",
              "name": "商品を受け取る",
              "activityId": "receive",
              "stepId": "delivered",
              "milestoneId": "mvp"
            },
            {
              "id": "order-list",
              "name": "過去の注文を一覧で見る",
              "activityId": "manage",
              "stepId": "history",
              "milestoneId": "mvp"
            },
            {
              "id": "order-detail",
              "name": "注文の状態と明細を見る",
              "activityId": "manage",
              "stepId": "history",
              "milestoneId": "v1"
            },
            {
              "id": "self-cancel",
              "name": "出荷指示前なら自分でキャンセルする",
              "description": "いまは問い合わせフォーム経由。出荷指示後はボタンを出さない",
              "activityId": "manage",
              "stepId": "cancel",
              "milestoneId": "v1"
            },
            {
              "id": "cancel-reason",
              "name": "キャンセル理由を選ぶ",
              "activityId": "manage",
              "stepId": "cancel",
              "milestoneId": "v1"
            },
            {
              "id": "partial-cancel",
              "name": "一部の商品だけキャンセルする",
              "description": "初回リリースの対象外",
              "activityId": "manage",
              "stepId": "cancel",
              "milestoneId": "v2"
            },
            {
              "id": "return-after-ship",
              "name": "出荷後に返品を申し込む",
              "activityId": "manage",
              "stepId": "cancel",
              "milestoneId": "v2"
            },
            {
              "id": "refund-mail",
              "name": "返金完了のメールを受け取る",
              "activityId": "manage",
              "stepId": "refund",
              "milestoneId": "v1"
            },
            {
              "id": "refund-status",
              "name": "返金の進み具合を注文詳細で見る",
              "description": "返金待ち → 取消済み",
              "activityId": "manage",
              "stepId": "refund",
              "milestoneId": "v1"
            },
            {
              "id": "point-refund",
              "name": "使ったポイント・クーポンが戻る",
              "activityId": "manage",
              "stepId": "refund",
              "milestoneId": "v2"
            },
            {
              "id": "refund-other-method",
              "name": "返金先を別の口座に指定する",
              "activityId": "manage",
              "stepId": "refund"
            }
          ]
        }
      </script>
    </dpk-template-usm>
  </body>
</html>
