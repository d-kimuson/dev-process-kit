<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Event Storming — EC 注文システム | dev-process-kit</title>
    <!--
      The framework is served from `dist/` by the dev asset server (`pnpm dev`), not
      by this page's own origin: the sample server is a separate origin on purpose,
      so the cross-origin (CORS) load is exercised locally too. A generated page
      loads the same files from jsDelivr instead.
    -->
    <script type="module" src="https://dev-process-kit.localhost/templates/event-storming.js"></script>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      dpk-template-event-storming {
        display: block;
        height: 100dvh;
      }
    </style>
  </head>
  <body>
    <dpk-template-event-storming storage-key="sample-event-storming-order">
      <script type="application/json">
        {
          "title": "EC 注文システム（Sora Market）",
          "contexts": [
            {
              "id": "order",
              "name": "注文",
              "description": "カートから注文確定・状態管理まで"
            },
            {
              "id": "inventory",
              "name": "在庫",
              "description": "在庫数と注文ごとの引当"
            },
            {
              "id": "payment",
              "name": "決済",
              "description": "決済代行とのオーソリ・売上確定"
            },
            {
              "id": "shipping",
              "name": "配送",
              "description": "出荷指示と配送業者の追跡"
            }
          ],
          "elements": [
            {
              "id": "customer",
              "type": "actor",
              "name": "購入者",
              "description": "Sora Market で商品を買う人",
              "contextId": "order"
            },
            {
              "id": "place-order",
              "type": "command",
              "name": "注文を確定する",
              "contextId": "order"
            },
            {
              "id": "order-aggregate",
              "type": "aggregate",
              "name": "注文",
              "description": "明細・金額・状態の集約",
              "contextId": "order"
            },
            {
              "id": "order-placed",
              "type": "event",
              "name": "注文確定済み",
              "description": "購入者が注文を確定した",
              "contextId": "order"
            },
            {
              "id": "reserve-policy",
              "type": "policy",
              "name": "注文が確定したら在庫を引き当てる",
              "contextId": "inventory"
            },
            {
              "id": "reserve-stock",
              "type": "command",
              "name": "在庫を引き当てる",
              "contextId": "inventory"
            },
            {
              "id": "stock-aggregate",
              "type": "aggregate",
              "name": "在庫",
              "description": "SKU ごとの在庫数と引当数",
              "contextId": "inventory"
            },
            {
              "id": "stock-reserved",
              "type": "event",
              "name": "在庫引当済み",
              "contextId": "inventory"
            },
            {
              "id": "capture-policy",
              "type": "policy",
              "name": "引当できたら売上を確定する",
              "contextId": "payment"
            },
            {
              "id": "capture-payment",
              "type": "command",
              "name": "売上を確定する",
              "contextId": "payment"
            },
            {
              "id": "psp",
              "type": "external",
              "name": "決済代行",
              "description": "カード決済の外部サービス",
              "contextId": "payment"
            },
            {
              "id": "payment-captured",
              "type": "event",
              "name": "支払い完了",
              "description": "注文は「支払済み」になる",
              "contextId": "payment"
            },
            {
              "id": "ship-policy",
              "type": "policy",
              "name": "支払いが済んだら出荷を指示する",
              "contextId": "shipping"
            },
            {
              "id": "instruct-shipment",
              "type": "command",
              "name": "出荷を指示する",
              "contextId": "shipping"
            },
            {
              "id": "shipment-instructed",
              "type": "event",
              "name": "出荷指示済み",
              "description": "倉庫がピッキングを始めた",
              "contextId": "shipping"
            },
            {
              "id": "carrier",
              "type": "external",
              "name": "配送業者",
              "description": "集荷と配達の状況を返す",
              "contextId": "shipping"
            },
            {
              "id": "delivered",
              "type": "event",
              "name": "配送完了",
              "contextId": "shipping"
            },
            {
              "id": "order-status-view",
              "type": "readmodel",
              "name": "注文履歴",
              "description": "購入者が見る注文の状態",
              "contextId": "order"
            },
            {
              "id": "cancel-rule",
              "type": "hotspot",
              "name": "キャンセル規定が曖昧",
              "description": "どこまで取り消せる？ 出荷指示前まで？ 返金と引当の戻し方は？"
            },
            {
              "id": "out-of-stock",
              "type": "hotspot",
              "name": "引当できなかったら？",
              "description": "同時購入で在庫切れになった注文の扱いが未定"
            },
            {
              "id": "psp-timeout",
              "type": "hotspot",
              "name": "決済代行のタイムアウト",
              "description": "応答が返らないとき売上確定を再試行してよいか"
            }
          ],
          "links": [
            {
              "id": "link-order",
              "from": "customer",
              "to": "place-order",
              "label": "操作する"
            },
            {
              "id": "link-order-aggregate",
              "from": "place-order",
              "to": "order-aggregate"
            },
            {
              "id": "link-placed",
              "from": "order-aggregate",
              "to": "order-placed",
              "label": "発行"
            },
            {
              "id": "link-reserve-rule",
              "from": "order-placed",
              "to": "reserve-policy",
              "label": "トリガー"
            },
            {
              "id": "link-reserve",
              "from": "reserve-policy",
              "to": "reserve-stock"
            },
            {
              "id": "link-stock-aggregate",
              "from": "reserve-stock",
              "to": "stock-aggregate"
            },
            {
              "id": "link-reserved",
              "from": "stock-aggregate",
              "to": "stock-reserved",
              "label": "発行"
            },
            {
              "id": "link-capture-rule",
              "from": "stock-reserved",
              "to": "capture-policy",
              "label": "トリガー"
            },
            {
              "id": "link-capture",
              "from": "capture-policy",
              "to": "capture-payment"
            },
            {
              "id": "link-psp",
              "from": "capture-payment",
              "to": "psp",
              "label": "請求する"
            },
            {
              "id": "link-captured",
              "from": "psp",
              "to": "payment-captured"
            },
            {
              "id": "link-ship-rule",
              "from": "payment-captured",
              "to": "ship-policy",
              "label": "トリガー"
            },
            {
              "id": "link-ship",
              "from": "ship-policy",
              "to": "instruct-shipment"
            },
            {
              "id": "link-instructed",
              "from": "instruct-shipment",
              "to": "shipment-instructed",
              "label": "発行"
            },
            {
              "id": "link-carrier",
              "from": "shipment-instructed",
              "to": "carrier",
              "label": "引き渡す"
            },
            {
              "id": "link-delivered",
              "from": "carrier",
              "to": "delivered"
            },
            {
              "id": "link-history",
              "from": "delivered",
              "to": "order-status-view",
              "label": "投影する"
            },
            {
              "id": "link-hs-cancel",
              "from": "cancel-rule",
              "to": "instruct-shipment",
              "kind": "member"
            },
            {
              "id": "link-hs-stock",
              "from": "out-of-stock",
              "to": "reserve-stock",
              "kind": "member"
            },
            {
              "id": "link-hs-psp",
              "from": "psp-timeout",
              "to": "capture-payment",
              "kind": "member"
            }
          ]
        }
      </script>
    </dpk-template-event-storming>
  </body>
</html>
