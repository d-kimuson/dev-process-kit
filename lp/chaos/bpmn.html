<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>dev-process-kit — BPMN stress</title>
    <!--
      Internal dev tool, not part of the published samples. Renders one fixture of
      fixtures/bpmn.js (`?fixture=<name>`, default `stress`) for
      dev/qa/bpmn-probe.ts to measure.
    -->
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      dpk-app {
        display: block;
        height: 100%;
      }
    </style>
    <script type="module">
      import { loadKit } from '../kit.js';
      import fixtures from './fixtures/bpmn.js';

      const name = new URLSearchParams(location.search).get('fixture') ?? 'stress';
      const fixture = fixtures[name];
      if (fixture === undefined)
        throw new Error(`Unknown fixture "${name}". Known: ${Object.keys(fixtures).join(', ')}`);
      const data = fixture.base;

      const json = (value) => {
        const script = document.createElement('script');
        script.type = 'application/json';
        script.textContent = JSON.stringify(value);
        return script;
      };
      const app = document.createElement('dpk-app');
      app.setAttribute('storage-key', `chaos-bpmn-${name}`);
      const page = document.createElement('dpk-page');
      page.setAttribute('name', 'bpmn');
      page.setAttribute('label', '業務プロセス');
      const board = document.createElement('dpk-board-bpmn');
      board.id = `chaos-${name}`;
      board.setAttribute('heading', 'BPMN');
      board.setAttribute('subject', name);
      board.append(json(data));
      page.append(board);
      app.append(json({ title: `BPMN — ${name}` }), page);
      document.body.append(app);
      loadKit(['components.js', 'boards.js']);
    </script>
  </head>
  <body></body>
</html>
