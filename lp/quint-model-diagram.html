            (invariant) => invariant.change !== 'removed' && (invariant.refs ?? []).some(writeTouches),
          );
          return {
            id,
            name: base.name,
            params: base.params ?? '',
            kind: base.kind,
            summary: base.summary ?? '',
            tags: base.tags ?? [],
            guards,
            writes,
            change,
            before: b,
            after: a,
            writeFields,
            guardFields,
            writeModels,
            guardModels,
            touchedModels,
            access,
            accessBcs,
            unchangedModels: models.map((model) => model.id).filter((modelId) => !touchedModels.has(modelId)),
            affectedInvariants,
          };
        });
        const actionById = new Map(actions.map((action) => [action.id, action]));

        return {
          before,
          after,
          models,
          modelById,
          invariants,
          invariantById,
          actions,
          actionById,
          bcModels: BCS.map((bc) => ({ ...bc, models: models.filter((model) => model.bc === bc.id) })),
          counts: {
            models: countBy(models),
            fields: countBy(models.flatMap((model) => model.fields)),
            invariants: countBy(invariants),
            actions: countBy(actions),
          },
        };
      }

      const QUINT_DIFF = deriveQuintDiff(QUINT_BEFORE, QUINT_AFTER);

      /* ===================================================================
         3. Quint source generation (page 2) — same snapshots, no hand-written diff.
         =================================================================== */
      const QUINT_HELPERS = [
        'pure def activeResByItem(rs: ResId -> Reservation, iid: ItemId): Set[Reservation] =',
        '  rs.values().filter(r => r.active and r.itemId == iid)',
        'pure def activeResByOrder(rs: ResId -> Reservation, oid: OrderId): Set[Reservation] =',
        '  rs.values().filter(r => r.active and r.orderId == oid)',
        'pure def activeResByLine(items: LineId -> OrderLine, rs: ResId -> Reservation, l: OrderLine): Set[Reservation] =',
        '  rs.values().filter(r => r.active and r.orderId == l.orderId and r.itemId == l.itemId)',
        'pure def charges(ps: PaymentId -> Payment, oid: OrderId): Set[Payment] =',
        '  ps.values().filter(p => p.orderId == oid and p.kind == Charge)',
        'pure def refunds(ps: PaymentId -> Payment, oid: OrderId): Set[Payment] =',
        '  ps.values().filter(p => p.orderId == oid and p.kind == Refund)',
        'pure def refundRequests(oid: OrderId): Set[RefundReq] =',
        '  refund_requests.values().filter(r => r.orderId == oid)',
        'pure def lastCharge(oid: OrderId): PaymentId =',
        '  charges(payments, oid).maxBy(p => p.id).id',
        'pure def idemKeyOf(rid: RefundId): str =',
        '  "refund-" + rid',
        'pure def couponAmount(cs: CouponId -> Coupon, c: Option[CouponId]): int =',
        '  if (c.none()) 0 else cs.get(c.get()).discountAmount',
      ];

      function quintSource(snapshot) {
        const lines = [];
        const recordName = (model) => model.signature.split('->').pop().trim();
        lines.push(`module ${snapshot.module} {`, '');
        lines.push('  // Types');
        for (const type of snapshot.types) lines.push(`  type ${type.name} = ${type.variants.join(' | ')}`);
        lines.push('', '  // Constants');
        for (const constant of snapshot.constants) {
          lines.push(`  const ${constant.name}: ${constant.type} = ${constant.value}`);
        }
        lines.push('', '  // Record types');
        for (const model of snapshot.models) {
          lines.push(
            `  type ${recordName(model)} = { ${model.fields.map((field) => `${field.name}: ${field.type}`).join(', ')} }`,
          );
        }
        lines.push('', '  // State variables');
        for (const model of snapshot.models) lines.push(`  var ${model.id}: ${model.signature}`);
        lines.push('', '  // Helpers');
        for (const helper of QUINT_HELPERS) lines.push(`  ${helper}`);
        for (const action of snapshot.actions) {
          lines.push('');
          const head = action.params ? `${action.id}(${action.params})` : action.id;
          lines.push(`  action ${head}: bool = all {`);
          for (const guard of action.guards) lines.push(`    ${guard.expr},`);
          if (action.guards.length > 0) lines.push('    all {');
          for (const write of action.writes) lines.push(`      ${write.expr},`);
          if (action.guards.length > 0) lines.push('    }');
          lines.push('  }');
        }
        lines.push('', '  // Invariants');
        for (const invariant of snapshot.invariants) lines.push(`  val ${invariant.id}: bool = ${invariant.expr}`);
        lines.push('}');
        return lines;
      }

      /** LCS line diff; the pair of sources is small enough for the plain table. */
      function lineDiff(beforeLines, afterLines) {
        const n = beforeLines.length;
        const m = afterLines.length;
        const table = Array.from({ length: n + 1 }, () => new Uint32Array(m + 1));
        for (let i = n - 1; i >= 0; i -= 1) {
          for (let j = m - 1; j >= 0; j -= 1) {
            table[i][j] =
              beforeLines[i] === afterLines[j] ? table[i + 1][j + 1] + 1 : Math.max(table[i + 1][j], table[i][j + 1]);
          }
        }
        const ops = [];
        let i = 0;
        let j = 0;
        while (i < n && j < m) {
          if (beforeLines[i] === afterLines[j]) {
            ops.push({ type: 'same', text: beforeLines[i] });
            i += 1;
            j += 1;
          } else if (table[i + 1][j] >= table[i][j + 1]) {
            ops.push({ type: 'del', text: beforeLines[i] });
            i += 1;
          } else {
            ops.push({ type: 'add', text: afterLines[j] });
            j += 1;
          }
        }
        while (i < n) {
          ops.push({ type: 'del', text: beforeLines[i] });
          i += 1;
        }
        while (j < m) {
          ops.push({ type: 'add', text: afterLines[j] });
          j += 1;
        }
        return ops;
      }

      function diffHunks(ops, context = 3) {
        const changed = [];
        for (let index = 0; index < ops.length; index += 1) {
          if (ops[index].type !== 'same') changed.push(index);
        }
        const ranges = [];
        for (const index of changed) {
          const start = Math.max(0, index - context);
          const end = Math.min(ops.length - 1, index + context);
          const last = ranges[ranges.length - 1];
          if (last && start <= last.end + 1) last.end = Math.max(last.end, end);
          else ranges.push({ start, end });
        }
        const beforePrefix = new Array(ops.length + 1).fill(0);
        const afterPrefix = new Array(ops.length + 1).fill(0);
        for (let index = 0; index < ops.length; index += 1) {
          beforePrefix[index + 1] = beforePrefix[index] + (ops[index].type === 'add' ? 0 : 1);
          afterPrefix[index + 1] = afterPrefix[index] + (ops[index].type === 'del' ? 0 : 1);
        }
        return ranges.map((range) => {
          const beforeLines = beforePrefix[range.end + 1] - beforePrefix[range.start];
          const afterLines = afterPrefix[range.end + 1] - afterPrefix[range.start];
          return {
            start: range.start,
            end: range.end,
            beforeStart: beforeLines === 0 ? beforePrefix[range.start] : beforePrefix[range.start] + 1,
            afterStart: afterLines === 0 ? afterPrefix[range.start] : afterPrefix[range.start] + 1,
            beforeLines,
            afterLines,
          };
        });
      }

      /* ===================================================================
         4. Page 2 renderer.
         =================================================================== */
      function renderQuintDiffPage() {
        const bodyEl = document.getElementById('qd-body');
        if (!bodyEl) return;
        const summaryEl = document.getElementById('qd-summary');
        const statsEl = document.getElementById('qd-stats');
        const footEl = document.getElementById('qd-foot');

        const beforeLines = quintSource(QUINT_BEFORE);
        const afterLines = quintSource(QUINT_AFTER);
        const ops = lineDiff(beforeLines, afterLines);
        const hunks = diffHunks(ops);

        const counts = QUINT_DIFF.counts;
        const statChip = (label, count) =>
          `<span class="qc-chip qc-chip--mono">${label} <span class="qc-stat">` +
          `<span class="qc-count-add">+${count.added}</span> ` +
          `<span class="qc-count-del">−${count.removed}</span> ` +
          `<span class="qc-count-chg">~${count.changed}</span> ` +
          `<span class="qc-count-same">=${count.same}</span>` +
          `</span></span>`;

        summaryEl.innerHTML = [
          `<div class="qd-stat"><span class="qd-stat-label">Module</span><span class="qd-stat-value">${QUINT_AFTER.module}.qnt</span></div>`,
          `<div class="qd-stat"><span class="qd-stat-label">State models</span><span class="qd-stat-value">${statChip('model', counts.models)}</span></div>`,
          `<div class="qd-stat"><span class="qd-stat-label">Actions</span><span class="qd-stat-value">${statChip('action', counts.actions)}</span></div>`,
          `<div class="qd-stat"><span class="qd-stat-label">Invariants</span><span class="qd-stat-value">${statChip('inv', counts.invariants)}</span></div>`,
          `<div class="qd-stat"><span class="qd-stat-label">Fields</span><span class="qd-stat-value">${statChip('field', counts.fields)}</span></div>`,
        ].join('');

        statsEl.innerHTML = [
          `<span class="qc-chip qc-chip--green">+${ops.filter((op) => op.type === 'add').length} 行</span>`,
          `<span class="qc-chip qc-chip--danger">−${ops.filter((op) => op.type === 'del').length} 行</span>`,
          `<span class="qc-chip qc-chip--blue">${hunks.length} ハンク</span>`,
          `<span class="qc-chip qc-chip--faint">context 3 行</span>`,
        ].join('');

        const parts = [];
        for (const hunk of hunks) {
          parts.push(
            `<div class="qd-hunk">@@ -${hunk.beforeStart},${hunk.beforeLines} +${hunk.afterStart},${hunk.afterLines} @@</div>`,
          );
          let beforeNo = hunk.beforeStart;
          let afterNo = hunk.afterStart;
          for (let index = hunk.start; index <= hunk.end; index += 1) {
            const op = ops[index];
            const beforeLabel = op.type === 'add' ? '' : String(beforeNo);
            const afterLabel = op.type === 'del' ? '' : String(afterNo);
            if (op.type === 'add') afterNo += 1;
            else if (op.type === 'del') beforeNo += 1;
            else {
              beforeNo += 1;
              afterNo += 1;
            }
            const className = op.type === 'add' ? 'is-add' : op.type === 'del' ? 'is-del' : 'is-same';
            const sign = op.type === 'add' ? '+' : op.type === 'del' ? '−' : ' ';
            parts.push(
              `<div class="qd-line ${className}"><span class="qd-ln">${beforeLabel}</span>` +
                `<span class="qd-ln">${afterLabel}</span>` +
                `<span class="qd-sign">${sign}</span>` +
                `<span class="qd-code">${escapeHtml(op.text)}</span></div>`,
            );
          }
        }
        bodyEl.innerHTML = parts.join('');

        footEl.innerHTML = [
          `<span class="qc-chip qc-chip--faint">図の差分は <code>deriveQuintDiff(QUINT_BEFORE, QUINT_AFTER)</code> で同じスナップショットから導出</span>`,
          `<span class="qc-chip qc-chip--faint">BC: ${BCS.map((bc) => `${bc.id} (${QUINT_DIFF.bcModels.find((entry) => entry.id === bc.id).models.length})`).join(' · ')}</span>`,
        ].join('');
      }

      const escapeHtml = (value) =>
        String(value).replace(
          /[&<>"']/g,
          (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char],
        );

      /* ===================================================================
         5. Page 1: the one `<dpk-dialog-panel>` frame — BC-grouped ERD, BC
         focus, the panel's own pan/zoom, and the docked action matrix.
         =================================================================== */
      const WORLD = {
        cardW: 300,
        colGap: 76,
        x0: 40,
        cardTop: 100,
        frameTop: 60,
        framePad: 20,
        cardGap: 18,
        crossGap: 30,
        bottomPad: 24,
      };
      const WORLD_W = WORLD.x0 * 2 + BCS.length * WORLD.cardW + (BCS.length - 1) * WORLD.colGap;
      const columnX = (index) => WORLD.x0 + index * (WORLD.cardW + WORLD.colGap);

      function loadQuintDiagram() {
        const rootEl = document.getElementById('qc-root');
        if (!rootEl) return;

        const byId = (id) => document.getElementById(id);
        const panel = byId('quint-panel');
        const worldEl = byId('qc-world');
        const bcLayerEl = byId('qc-bc-layer');
        const cardsEl = byId('qc-cards');
        const crossBandEl = byId('qc-cross-band');
        const drawerEl = byId('qc-drawer');
        const drawerResizeEl = byId('qc-drawer-resize');
        const actionListEl = byId('qc-action-list');
        const actionListWrapEl = byId('qc-action-list-wrap');
        const drawerCountEl = byId('qc-drawer-count');
        const tooltipEl = byId('qc-action-tooltip');
        const caretEl = byId('qc-detail-caret');
        const searchInput = byId('qc-search');
        const clearBtn = byId('qc-clear');
        const togglePanelBtn = byId('qc-toggle-panel');
        const toggleBcBtn = byId('qc-toggle-bc');
        const toggleExprBtn = byId('qc-toggle-expr');
        const tagFilterEl = byId('quint-tag-filter');
        const labelFilterEl = byId('quint-label-filter');
        const modeButtons = [...rootEl.querySelectorAll('#qc-mode button')];

        const state = {
          mode: 'diff',
          bcFrames: true,
          showExpr: false,
          panelCollapsed: false,
          drawerWidth: 400,
          lockedAction: null,
          hoveredAction: null,
          detailAction: null,
          lockedErd: null,
          hoveredErd: null,
          bcFocus: [],
          labelActive: [],
          search: '',
          layoutStale: false,
        };

        const layout = { world: { x: 0, y: 0, w: WORLD_W, h: 1000 }, frames: new Map(), band: null };
        const fieldTitles = new Map();
        /** Whether the press that is in flight began inside the drawer. */
        let pressInDrawer = false;
        let searchTimer = 0;

        const diff = QUINT_DIFF;
        const localInvsOf = (modelId) =>
          diff.invariants.filter(
            (invariant) =>
              invariant.scope === 'local' &&
              invariant.model === modelId &&
              (state.mode === 'diff' || invariant.change !== 'removed'),
          );
        const crossInvs = () =>
          diff.invariants.filter(
            (invariant) => invariant.scope === 'cross' && (state.mode === 'diff' || invariant.change !== 'removed'),
          );
        const visibleModels = () => diff.models.filter((model) => state.mode === 'diff' || model.change !== 'removed');
        const visibleActions = () =>
          diff.actions.filter((action) => state.mode === 'diff' || action.change !== 'removed');
        const activeAction = () => {
          const id = state.lockedAction ?? state.hoveredAction;
          return id ? (diff.actionById.get(id) ?? null) : null;
        };
        /* The Action whose detail popover is open, if any: only a click opens it. */
        const detailAction = () => (state.detailAction ? (diff.actionById.get(state.detailAction) ?? null) : null);
        const activeErd = () => state.lockedErd ?? state.hoveredErd;
        const parseErd = (value) => {
          const separator = value.indexOf(':');
          return { type: value.slice(0, separator), id: value.slice(separator + 1) };
        };
        const sameErd = (a, b) => Boolean(a && b && a.type === b.type && a.id === b.id);

        /* ---------------- tag filter wiring ---------------- */
        function tagOptions() {
          const counts = new Map(TAG_ORDER.map((tag) => [tag, 0]));
          const bump = (tags) => {
            for (const tag of tags ?? []) counts.set(tag, (counts.get(tag) ?? 0) + 1);
          };
          for (const model of visibleModels()) bump(model.tags);
          for (const invariant of diff.invariants) {
            if (state.mode !== 'diff' && invariant.change === 'removed') continue;
            bump(invariant.tags);
          }
          for (const action of visibleActions()) bump(action.tags);
          return [
            ...BCS.map((bc) => ({
              tag: `BC:${bc.id}`,
              count: visibleModels().filter((model) => model.bc === bc.id).length,
            })),
            ...TAG_ORDER.map((tag) => ({ tag, count: counts.get(tag) ?? 0 })),
          ];
        }

        function seedTagFilter() {
          tagFilterEl.tags = tagOptions();
          labelFilterEl.tags = TAG_ORDER;
          labelFilterEl.active = state.labelActive;
          labelFilterEl.match = tagFilterEl.match ?? 'single';
        }

        function onTagChange(event) {
          const previousBc = state.bcFocus.join(',');
          const active = Array.isArray(event.detail?.active) ? event.detail.active : [];
          state.bcFocus = active.filter((tag) => tag.startsWith('BC:')).map((tag) => tag.slice(3));
          state.labelActive = active.filter((tag) => !tag.startsWith('BC:'));
          labelFilterEl.active = state.labelActive;
          labelFilterEl.match = event.detail?.match ?? 'single';
          renderActionList();
          applyVisuals();
          if (state.bcFocus.join(',') === previousBc) return;
          // A BC pick is a focus request: the panel fits it, the drawer-aware way.
          if (state.bcFocus.length > 0) fitFocus();
          else resetView();
        }

        /* ---------------- the panel's own camera ---------------- */
        const drawerOpen = () => !state.panelCollapsed;
        const drawerWidth = () => (drawerOpen() ? drawerEl.offsetWidth : 0);

        /** The focused BCs' world box, or the whole world when nothing is focused. */
        function focusBox() {
          const rects = state.bcFocus.map((id) => layout.frames.get(id)).filter(Boolean);
          if (rects.length > 0) {
            const left = Math.min(...rects.map((rect) => rect.x));
            const top = Math.min(...rects.map((rect) => rect.y));
            const right = Math.max(...rects.map((rect) => rect.x + rect.w));
            const bottom = Math.max(...rects.map((rect) => rect.y + rect.h));
            return { x: left, y: top, width: right - left, height: bottom - top };
          }
          return { x: layout.world.x, y: layout.world.y, width: layout.world.w, height: layout.world.h };
        }

        /**
         * Fits the focus into what the reader can actually see. With the drawer
         * docked, the box is grown to the right by `drawerWidth / scale` world
         * pixels, so the focused BC lands centred in the unobstructed canvas
         * instead of half underneath the drawer. The scale is read back from the
         * panel after each attempt, so the padding follows the panel's own fit
         * maths (and its 0.08–1.8 limits) rather than guessing at them.
         */
        function fitFocus() {
          const box = focusBox();
          const drawer = drawerWidth();
          if (drawer <= 0) {
            panel.fitTo(box);
            return;
          }
          let padded = box;
          for (let step = 0; step < 3; step += 1) {
            panel.fitTo(padded);
            const scale = panel.view.scale;
            if (!scale) break;
            padded = { x: box.x, y: box.y, width: box.width + drawer / scale, height: box.height };
          }
          panel.fitTo(padded);
        }

        /**
         * The view a diagram opens in: 100%, from the content's own corner.
         * Deferred a task, so the panel has taken the content size we just set
         * (its own `apply()` would otherwise clamp an empty area to 0,0).
         */
        const resetView = () => window.setTimeout(() => panel.resetView(), 0);

        /*
         * The drawer's width is the reader's. One clamp owns it: the CSS var
         * feeds the drawer, the legend and the floating control menu's
         * clearance (`::part(controls)`), so they never disagree.
         */
        const DRAWER = { min: 280, max: 640, initial: 400, ratio: 0.6, step: 16, bigStep: 48 };
        function drawerLimit() {
          const available = panel.clientWidth > 0 ? panel.clientWidth * DRAWER.ratio : DRAWER.max;
          return Math.round(Math.max(DRAWER.min, Math.min(DRAWER.max, available)));
        }
        function setDrawerWidth(px, { refit = false } = {}) {
          const limit = drawerLimit();
          const next = Math.round(Math.min(Math.max(Number(px) || DRAWER.initial, DRAWER.min), limit));
          state.drawerWidth = next;
          panel.style.setProperty('--qc-drawer-w', `${next}px`);
          drawerResizeEl.setAttribute('aria-valuemin', String(DRAWER.min));
          drawerResizeEl.setAttribute('aria-valuemax', String(limit));
          drawerResizeEl.setAttribute('aria-valuenow', String(next));
          // The card's anchor is the drawer's edge, so it tracks the live width.
          positionTooltip();
          if (refit && drawerOpen() && state.bcFocus.length > 0) {
            // The var is already applied, so the drawer measures its new width now;
            // fit immediately and once more next frame, after the panel settles.
            fitFocus();
            window.requestAnimationFrame(() => fitFocus());
          }
          return next;
        }

        /* ---------------- markup builders ---------------- */
        const diffMark = (change) =>
          state.mode === 'diff'
            ? `<span class="qc-mark is-${change}" aria-hidden="true">${MARK[change] ?? ''}</span>`
            : '';

        const diffChip = (change) =>
          state.mode === 'diff' && change !== 'same'
            ? `<span class="qc-diff-chip is-${change}">${CHANGE_LABEL[change]}</span>`
            : '';

        /* After mode is the target state read plainly: every diff tint and
           border resolves to the neutral tone while the structure stays. */
        const toneOf = (change) => (state.mode === 'diff' ? change : 'same');

        const statusChip = (invariant) => {
          if (
            state.mode === 'diff' &&
            invariant.statusFrom &&
            invariant.statusTo &&
            invariant.statusFrom !== invariant.statusTo
          ) {
            return `<span class="qc-status qc-status--${invariant.statusTo}"><del>${escapeHtml(invariant.statusFrom)}</del>→${escapeHtml(invariant.statusTo)}</span>`;
          }
          return `<span class="qc-status qc-status--${invariant.status}">${escapeHtml(invariant.status)}</span>`;
        };

        const fieldTypeHtml = (field) => {
          if (state.mode !== 'diff' || field.change !== 'changed') return escapeHtml(field.type ?? '');
          const beforeType = field.before?.type ?? '';
          const afterType = field.after?.type ?? '';
          if (beforeType !== afterType)
            return `<del>${escapeHtml(beforeType)}</del> <ins>${escapeHtml(afterType)}</ins>`;
          const added = field.variantChange.added;
          const removed = field.variantChange.removed;
          if (added.length === 0 && removed.length === 0) return escapeHtml(field.type ?? '');
          const before = (field.before?.variants ?? []).join(' | ');
          const after = (field.after?.variants ?? []).join(' | ');
          const parts = [
            ...removed.map((value) => `<del>${escapeHtml(value)}</del>`),
            ...added.map((value) => `<ins>+${escapeHtml(value)}</ins>`),
          ];
          return `<span title="${escapeHtml(`${field.type}: ${before} → ${after}`)}">${escapeHtml(field.type)} ${parts.join(' ')}</span>`;
        };

        function fieldRowHtml(model, field) {
          const fieldId = `${model.id}.${field.name}`;
          const badges = [
            field.key ? `<span class="qc-tag qc-tag--key">KEY</span>` : '',
            field.ref ? `<span class="qc-tag qc-tag--ref" title="→ ${escapeHtml(field.ref)}">REF</span>` : '',
          ].join('');
          const title = [
            field.desc,
            field.variants ? field.variants.join(' | ') : '',
            field.ref ? `→ ${field.ref}` : '',
          ]
            .filter(Boolean)
            .join('\n');
          return (
            `<li class="qc-field is-${toneOf(field.change)}" role="button" tabindex="0" data-erd="field:${fieldId}" data-field-row="${fieldId}" title="${escapeHtml(title)}">` +
            (state.mode === 'diff' ? diffMark(field.change) : '') +
            `<span class="qc-field-main"><span class="qc-field-name">${escapeHtml(field.name)}</span>${badges}</span>` +
            `<span class="qc-field-type">${fieldTypeHtml(field)}</span>` +
            `<span class="qc-gw" data-gw="${fieldId}" aria-hidden="true"></span>` +
            `</li>`
          );
        }

        const invariantRowHtml = (invariant) =>
          `<div class="qc-inv is-${toneOf(invariant.change)}" role="button" tabindex="0" data-erd="inv:${invariant.id}" data-inv="${invariant.id}">` +
          `<div class="qc-inv-top">${diffMark(invariant.change)}` +
          `<span class="qc-inv-title">${escapeHtml(invariant.title)}</span>${statusChip(invariant)}</div>` +
          (invariant.bound ? `<span class="qc-bound">${escapeHtml(invariant.bound)}</span>` : '') +
          `<code class="qc-inv-expr qc-expr">${escapeHtml(invariant.expr)}</code>` +
          `</div>`;

        function cardHtml(model) {
          const invariants = localInvsOf(model.id);
          const fields = model.fields.filter((field) => state.mode === 'diff' || field.change !== 'removed');
          return (
            `<article class="qc-card is-${toneOf(model.change)}" role="button" tabindex="0" data-erd="model:${model.id}" data-model="${model.id}" data-bc="${model.bc}" style="width:${WORLD.cardW}px">` +
            `<header class="qc-card-head">` +
            `<div class="qc-head-top">` +
            `<svg class="qc-model-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="2" y="2.5" width="12" height="11" rx="2"></rect><path d="M2 6.2h12M6.4 6.2v7.3"></path></svg>` +
            `<span class="qc-model-name" title="${escapeHtml(model.id)}">${escapeHtml(model.id)}</span>` +
            `<span class="qc-model-jp">${escapeHtml(model.label)}</span>` +
            `<span class="qc-gw qc-head-gw" data-gw="${model.id}" aria-hidden="true"></span>` +
            diffChip(model.change) +
            `</div>` +
            `<div class="qc-head-sub">` +
            `<span class="qc-sig" title="${escapeHtml(model.signature)}">${escapeHtml(model.signature)}</span>` +
            `<span class="qc-unchanged" data-unchanged="${model.id}">unchanged</span>` +
            `</div>` +
            `</header>` +
            `<ul class="qc-fields">${fields.map((field) => fieldRowHtml(model, field)).join('')}</ul>` +
            `<div class="qc-invs">` +
            `<div class="qc-invs-label"><svg class="qc-inv-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M8 2.2 13 4v4.1c0 2.6-2 4.4-5 5.7-3-1.3-5-3.1-5-5.7V4z"></path></svg>` +
            `<span>Local Invariants (${invariants.length})</span></div>` +
            invariants.map((invariant) => invariantRowHtml(invariant)).join('') +
            `</div>` +
            `</article>`
          );
        }

        const bcFrameHtml = (bc) =>
          `<div class="qc-bc" data-bc="${bc.id}" style="left:0;top:0;width:0;height:0">` +
          `<span class="qc-bc-label"><b>BC:${bc.id}</b><span>${escapeHtml(bc.label)}</span></span>` +
          `</div>`;

        function crossBandHtml() {
          const invariants = crossInvs();
          return (
            `<span class="qc-cross-label">CROSS-MODEL INVARIANTS（${invariants.length}）</span>` +
            `<div class="qc-cross-grid">` +
            invariants
              .map((invariant) => {
                const refs = [...new Set((invariant.refs ?? []).map((ref) => ref.split('.')[0]))];
                return (
                  `<div class="qc-cross-card is-${toneOf(invariant.change)}" role="button" tabindex="0" data-erd="inv:${invariant.id}" data-inv="${invariant.id}">` +
                  `<div class="qc-cross-id"><svg class="qc-inv-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M8 2.2 13 4v4.1c0 2.6-2 4.4-5 5.7-3-1.3-5-3.1-5-5.7V4z"></path></svg>` +
                  diffMark(invariant.change) +
                  `<span>${escapeHtml(invariant.id)}</span>${statusChip(invariant)}</div>` +
                  `<div class="qc-cross-title">${escapeHtml(invariant.title)}</div>` +
                  (invariant.bound ? `<span class="qc-bound">${escapeHtml(invariant.bound)}</span>` : '') +
                  `<code class="qc-inv-expr qc-expr">${escapeHtml(invariant.expr)}</code>` +
                  `<div class="qc-cross-refs">${refs
                    .map((ref) => `<span class="qc-cross-ref">${escapeHtml(ref)}</span>`)
                    .join('')}</div>` +
                  `</div>`
                );
              })
              .join('') +
            `</div>`
          );
        }

        function renderCards() {
          cardsEl.innerHTML = visibleModels()
            .map((model) => cardHtml(model))
            .join('');
          bcLayerEl.innerHTML = BCS.map((bc) => bcFrameHtml(bc)).join('');
          crossBandEl.innerHTML = crossBandHtml();
          fieldTitles.clear();
          cardsEl.querySelectorAll('.qc-field').forEach((row) => {
            fieldTitles.set(row.dataset.fieldRow, row.getAttribute('title') ?? '');
          });
        }

        /**
         * The one header subtitle: the diff counts in Diff mode, the plain
         * inventory of what is on the canvas in After mode. It replaces the old
         * separate summary row, so there is a single header and a single line.
         */
        function updateSubject() {
          if (state.mode === 'diff') {
            const counts = diff.counts;
            const marks = (count) => `+${count.added} −${count.removed} ~${count.changed}`;
            panel.subject = `モデル ${marks(counts.models)} · Action ${marks(counts.actions)}`;
            return;
          }
          panel.subject = `${BCS.length} BC · ${visibleModels().length} モデル · ${visibleActions().length} Actions`;
        }

        /* ---------------- layout ---------------- */
        function layoutWorld() {
          if (!cardsEl) return;
          const cards = [...cardsEl.querySelectorAll('[data-model]')];
          let maxBottom = WORLD.cardTop;
          BCS.forEach((bc, index) => {
            const x = columnX(index);
            let y = WORLD.cardTop;
            for (const card of cards.filter((entry) => entry.dataset.bc === bc.id)) {
              card.style.left = `${x}px`;
              card.style.top = `${y}px`;
              y += card.offsetHeight + WORLD.cardGap;
            }
            const bottom = y - WORLD.cardGap;
            const frame = bcLayerEl.querySelector(`[data-bc="${bc.id}"]`);
            const height = Math.max(bottom, WORLD.cardTop) - WORLD.frameTop + WORLD.framePad;
            const rect = {
              x: x - WORLD.framePad,
              y: WORLD.frameTop,
              w: WORLD.cardW + WORLD.framePad * 2,
              h: height,
            };
            if (frame) {
              frame.style.left = `${rect.x}px`;
              frame.style.top = `${rect.y}px`;
              frame.style.width = `${rect.w}px`;
              frame.style.height = `${rect.h}px`;
            }
            layout.frames.set(bc.id, rect);
            maxBottom = Math.max(maxBottom, rect.y + rect.h);
          });

          const bandTop = maxBottom + WORLD.crossGap;
          crossBandEl.style.left = `${WORLD.x0}px`;
          crossBandEl.style.top = `${bandTop}px`;
          crossBandEl.style.width = `${WORLD_W - WORLD.x0 * 2}px`;
          const bandHeight = crossBandEl.offsetHeight;
          layout.band = { x: WORLD.x0, y: bandTop, w: WORLD_W - WORLD.x0 * 2, h: bandHeight };

          const worldHeight = bandTop + bandHeight + WORLD.bottomPad;
          layout.world = { x: 0, y: 0, w: WORLD_W, h: worldHeight };
          // The panel sizes its world from these; a change re-applies the view.
          panel.contentWidth = Math.ceil(WORLD_W);
          panel.contentHeight = Math.ceil(worldHeight);
          applyVisuals();
        }

        /* ---------------- visuals (never touches geometry) ---------------- */
        const modelMatches = (model, query) =>
          model.id.toLowerCase().includes(query) ||
          (model.label ?? '').toLowerCase().includes(query) ||
          (model.signature ?? '').toLowerCase().includes(query) ||
          model.fields.some(
            (field) =>
              field.name.toLowerCase().includes(query) ||
              (field.type ?? '').toLowerCase().includes(query) ||
              (field.desc ?? '').toLowerCase().includes(query),
          );

        const invariantMatches = (invariant, query) =>
          (invariant.id ?? '').toLowerCase().includes(query) ||
          (invariant.title ?? '').toLowerCase().includes(query) ||
          (invariant.expr ?? '').toLowerCase().includes(query);

        const actionMatches = (action, query) =>
          action.id.toLowerCase().includes(query) ||
          (action.params ?? '').toLowerCase().includes(query) ||
          (action.summary ?? '').toLowerCase().includes(query) ||
          (action.tags ?? []).some((tag) => tag.toLowerCase().includes(query));

        function applyVisuals() {
          if (!cardsEl) return;
          const action = activeAction();
          const erd = activeErd();
          const bcFocus = new Set(state.bcFocus);
          // Which models a locked/hovered canvas pick covers, for the list's own highlight.
          let erdModels = null;
          if (!action && erd) {
            if (erd.type === 'model') erdModels = new Set([erd.id]);
            else if (erd.type === 'field') erdModels = new Set([erd.id.split('.')[0]]);
            else if (erd.type === 'inv')
              erdModels = new Set((diff.invariantById.get(erd.id)?.refs ?? []).map((ref) => ref.split('.')[0]));
          }
          const labelsOn = state.labelActive.length > 0;
          const query = state.search.trim().toLowerCase();
          // Invariants are searchable too: their id, title and Quint expression.
          const invariantSearch = new Map();
          for (const invariant of diff.invariants) {
            invariantSearch.set(invariant.id, !query || invariantMatches(invariant, query));
          }

          // Reset every dynamic mark first; only colour and visibility change.
          cardsEl.querySelectorAll('.qc-field').forEach((row) => {
            row.classList.remove('is-r', 'is-w', 'is-rw', 'is-field-active', 'is-inv-ref', 'is-search-hit');
            row.title = fieldTitles.get(row.dataset.fieldRow) ?? '';
            const slot = row.querySelector('.qc-gw');
            if (slot) {
              slot.className = 'qc-gw';
              slot.textContent = '';
            }
          });
          cardsEl.querySelectorAll('.qc-head-gw').forEach((slot) => {
            slot.className = 'qc-gw qc-head-gw';
            slot.textContent = '';
          });
          rootEl.querySelectorAll('[data-inv]').forEach((node) => node.classList.remove('is-active', 'is-inv-hit'));

          for (const model of diff.models) {
            const card = cardsEl.querySelector(`[data-model="${model.id}"]`);
            if (!card) continue;
            const labelOk = !labelsOn || labelFilterEl.passes(model.tags ?? []);
            const searchOk =
              !query ||
              modelMatches(model, query) ||
              diff.invariants.some(
                (invariant) =>
                  invariant.scope === 'local' &&
                  invariant.model === model.id &&
                  invariantSearch.get(invariant.id) === true,
              );
            let dim = 1;
            if (bcFocus.size > 0 && !bcFocus.has(model.bc)) dim = Math.min(dim, 0.24);
            if (!labelOk) dim = Math.min(dim, 0.15);
            if (action && !action.touchedModels.has(model.id)) dim = Math.min(dim, 0.32);
            if (query && !searchOk) dim = Math.min(dim, 0.3);
            card.style.opacity = String(dim);
            card.style.pointerEvents = labelOk ? '' : 'none';
            card.classList.toggle('is-label-hit', labelsOn && labelOk && model.change !== 'removed');
            card.classList.toggle('is-search-hit', Boolean(query) && searchOk);
            card.classList.remove('is-active', 'is-related');
            const pill = card.querySelector('[data-unchanged]');
            if (pill) pill.classList.toggle('is-on', Boolean(action) && !action.touchedModels.has(model.id));
          }

          bcLayerEl.querySelectorAll('[data-bc]').forEach((frame) => {
            frame.style.opacity = bcFocus.size > 0 && !bcFocus.has(frame.dataset.bc) ? '0.24' : '1';
          });

          crossBandEl.querySelectorAll('[data-inv]').forEach((node) => {
            const invariant = diff.invariantById.get(node.dataset.inv);
            const bcs = new Set(
              (invariant?.refs ?? []).map((ref) => diff.modelById.get(ref.split('.')[0])?.bc).filter(Boolean),
            );
            const inFocus = bcFocus.size === 0 || [...bcs].some((bc) => bcFocus.has(bc));
            let dim = inFocus ? 1 : 0.24;
            if (labelsOn && !labelFilterEl.passes(invariant?.tags ?? [])) dim = Math.min(dim, 0.15);
            if (query && invariantSearch.get(node.dataset.inv) === false) dim = Math.min(dim, 0.3);
            node.style.opacity = String(dim);
          });

          rootEl.querySelectorAll('[data-inv]').forEach((node) => {
            node.classList.toggle('is-search-hit', Boolean(query) && invariantSearch.get(node.dataset.inv) === true);
          });

          if (query) {
            cardsEl.querySelectorAll('.qc-field').forEach((row) => {
              const [modelId, fieldName] = row.dataset.fieldRow.split('.');
              const field = diff.modelById.get(modelId)?.fields.find((entry) => entry.name === fieldName);
              if (!field) return;
              const haystack = `${field.name} ${field.type ?? ''} ${field.desc ?? ''}`.toLowerCase();
              if (haystack.includes(query)) row.classList.add('is-search-hit');
            });
          }

          if (action) {
            for (const id of action.touchedModels) {
              const card = cardsEl.querySelector(`[data-model="${id}"]`);
              card?.classList.add('is-related');
            }
            const guards = new Map();
            const writes = new Map();
            const anchorOf = (step) => step.at ?? step.field;
            // A removed action projects its before-state steps: that is where the reader should look.
            const withRemoved = action.change === 'removed';
            for (const guard of action.guards) {
              if (withRemoved || guard.change !== 'removed') guards.set(anchorOf(guard), guard);
            }
            for (const write of action.writes) {
              if (withRemoved || write.change !== 'removed') writes.set(anchorOf(write), write);
            }
            for (const key of new Set([...guards.keys(), ...writes.keys()])) {
              const hasR = guards.has(key);
              const hasW = writes.has(key);
              const kind = hasR && hasW ? 'is-rw' : hasW ? 'is-w' : 'is-r';
              if (key.includes('.')) {
                const row = cardsEl.querySelector(`.qc-field[data-field-row="${key}"]`);
                if (!row) continue;
                row.classList.add(kind);
                const slot = row.querySelector('.qc-gw');
                if (slot) {
                  slot.classList.add(kind);
                  slot.textContent = hasR && hasW ? 'R·W' : hasW ? 'W' : 'R';
                }
                const hints = [
                  guards.has(key) ? `R: ${guards.get(key).expr}` : '',
                  writes.has(key) ? `W: ${writes.get(key).expr}` : '',
                ].filter(Boolean);
                row.title = hints.join('\n');
              } else {
                const card = cardsEl.querySelector(`[data-model="${key}"]`);
                if (!card) continue;
                const slot = card.querySelector('.qc-head-gw');
                if (slot) {
                  slot.classList.add(kind);
                  slot.textContent = hasR && hasW ? 'R·W' : hasW ? 'W' : 'R';
                }
              }
            }
            for (const invariant of action.affectedInvariants) {
              rootEl
                .querySelectorAll(`[data-inv="${invariant.id}"]`)
                .forEach((node) => node.classList.add('is-inv-hit'));
            }
          } else if (erd) {
            if (erd.type === 'model') {
              cardsEl.querySelector(`[data-model="${erd.id}"]`)?.classList.add('is-active');
            } else if (erd.type === 'field') {
              cardsEl.querySelector(`[data-field-row="${erd.id}"]`)?.classList.add('is-field-active');
            } else if (erd.type === 'inv') {
              rootEl.querySelectorAll(`[data-inv="${erd.id}"]`).forEach((node) => node.classList.add('is-active'));
              const invariant = diff.invariantById.get(erd.id);
              for (const ref of invariant?.refs ?? []) {
                cardsEl.querySelector(`[data-field-row="${ref}"]`)?.classList.add('is-inv-ref');
              }
            }
          }

          actionListEl.querySelectorAll('.qc-action-row').forEach((row) => {
            const item = row.querySelector('[data-action]');
            if (!item) return;
            const actionOfRow = diff.actionById.get(item.dataset.action);
            if (!actionOfRow) return;
            const labelOk = !labelsOn || labelFilterEl.passes(actionOfRow.tags ?? []);
            row.hidden = !labelOk;
            const touchesFocus = bcFocus.size === 0 || [...actionOfRow.accessBcs].some((bc) => bcFocus.has(bc));
            item.classList.toggle('is-dimmed', bcFocus.size > 0 && !touchesFocus);
            item.classList.toggle('is-active', !state.lockedAction && state.hoveredAction === actionOfRow.id);
            item.classList.toggle('is-locked', state.lockedAction === actionOfRow.id);
            item.classList.toggle('is-search', Boolean(query) && actionMatches(actionOfRow, query));
            item.classList.toggle(
              'is-erd-hit',
              Boolean(erdModels) && actionOfRow.access.some((entry) => erdModels.has(entry.id)),
            );
            item.setAttribute('aria-pressed', String(state.lockedAction === actionOfRow.id));
            const detailBtn = row.querySelector('[data-action-detail]');
            if (detailBtn) detailBtn.setAttribute('aria-expanded', String(state.detailAction === actionOfRow.id));
            item.querySelectorAll('.qc-mchip').forEach((chip) => {
              chip.classList.toggle('is-bc-focus', bcFocus.has(chip.dataset.bc ?? ''));
            });
          });

          clearBtn.hidden = !(state.lockedAction || state.lockedErd);
        }

        /** The lock is what a screen reader hears: the pressed state of the picked element. */
        function syncPicked() {
          rootEl.querySelectorAll('[data-erd]').forEach((node) => {
            const pressed = sameErd(state.lockedErd, parseErd(node.dataset.erd));
            if (pressed) node.setAttribute('aria-pressed', 'true');
            else node.removeAttribute('aria-pressed');
          });
        }

        /* ---------------- action list ---------------- */
        const modelChipHtml = (entry) => {
          const kindLabel = entry.kind === 'rw' ? 'R·W' : entry.kind === 'w' ? 'W' : 'R';
          const change = state.mode === 'diff' ? entry.change : 'same';
          const mark =
            change === 'same' ? '' : `<span class="qc-mchip-mark" aria-hidden="true">${MARK[change] ?? ''}</span>`;
          const classes = [
            'qc-mchip',
            `qc-mchip--${entry.kind}`,
            change === 'same' ? '' : `is-${change}`,
            state.bcFocus.includes(entry.bc) ? 'is-bc-focus' : '',
          ]
            .filter(Boolean)
            .join(' ');
          return (
            `<span class="${classes}" data-bc="${escapeHtml(entry.bc ?? '')}" title="${escapeHtml(`${kindLabel} · ${entry.id}`)}">` +
            mark +
            `<span class="qc-mchip-kind">${kindLabel}</span> ` +
            `<span class="qc-mchip-name">${escapeHtml(entry.id)}</span>` +
            `</span>`
          );
        };

        /* One crisp 14px icon, in the row's own ink and weight. */
        const detailIcon =
          `<svg viewBox="0 0 14 14" width="14" height="14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">` +
          `<circle cx="7" cy="7" r="5.15"></circle>` +
          `<path d="M7 6.3v3.5"></path>` +
          `<path d="M7 4.2h.01"></path>` +
          `</svg>`;

        /**
         * One row per Action: the diff mark, its name and kind, its one-line
         * summary, then every Quint model it reads and writes as a chip. After
         * mode prints only the `after` accesses, with no mark at all. The row
         * button and the detail button are siblings, never nested: a button in
         * a button is not valid HTML, and the detail one needs its own hits.
         */
        function renderActionList() {
          const actions = visibleActions();
          actionListEl.innerHTML = actions
            .map((action) => {
              const access =
                state.mode === 'diff' ? action.access : action.access.filter((entry) => entry.change !== 'removed');
              const locked = state.lockedAction === action.id;
              return (
                `<li class="qc-action-row">` +
                `<button type="button" class="qc-action-item" data-action="${action.id}" data-status="${toneOf(action.change)}" aria-pressed="${locked}">` +
                `<span class="qc-action-head">` +
                (state.mode === 'diff'
                  ? `<span class="qc-mark is-${action.change}" aria-hidden="true">${MARK[action.change] ?? ''}</span>`
                  : '') +
                `<code class="qc-action-name">${escapeHtml(action.name)}(${escapeHtml(action.params)})</code>` +
                `<span class="qc-kind is-${action.kind}">${escapeHtml(action.kind)}</span>` +
                `</span>` +
                `<span class="qc-action-summary">${escapeHtml(action.summary)}</span>` +
                `<span class="qc-action-chips">${access.map((entry) => modelChipHtml(entry)).join('')}</span>` +
                `</button>` +
                `<button type="button" class="qc-action-detail-btn" data-action-detail="${action.id}" ` +
                `aria-label="${escapeHtml(action.name)} の詳細" aria-expanded="${state.detailAction === action.id}" ` +
                `aria-controls="qc-action-tooltip" title="詳細">${detailIcon}</button>` +
                `</li>`
              );
            })
            .join('');
          drawerCountEl.textContent = String(actions.length);
          drawerCountEl.title = `${actions.length} Actions`;
          // Rows moved: the card stays on the active one.
          positionTooltip();
        }

        /* ---------------- detail tooltip ---------------- */
        const tooltipTargetHtml = (step, changed) => {
          if (changed && step.beforeAt !== step.afterAt) {
            return (
              `<span class="qc-tooltip-target"><code>${escapeHtml(step.beforeAt ?? '')}</code>` +
              `<span class="qc-tooltip-arrow" aria-hidden="true">→</span>` +
              `<code>${escapeHtml(step.afterAt ?? '')}</code></span>`
            );
          }
          return `<span class="qc-tooltip-target"><code>${escapeHtml(step.at ?? step.field ?? '')}</code></span>`;
        };

        /**
         * One guard or write: the Japanese sentence first, the model/field it
         * lands on as a small muted tag, and the Quint expression only when the
         * Quint式 toggle is on — `.qc-expr` hides it otherwise.
         */
        function tooltipItemHtml(step) {
          const changed = state.mode === 'diff' && step.change === 'changed';
          const mark =
            state.mode === 'diff'
              ? `<span class="qc-mark is-${step.change}" aria-hidden="true">${MARK[step.change] ?? ''}</span>`
              : '';
          const text = changed
            ? `<del>${escapeHtml(step.beforeLabel ?? '')}</del>` +
              `<span class="qc-tooltip-arrow" aria-hidden="true">→</span>` +
              `<ins>${escapeHtml(step.afterLabel ?? '')}</ins>`
            : escapeHtml(step.label ?? '');
          const expr = changed
            ? `<code class="qc-tooltip-expr qc-expr"><del>${escapeHtml(step.beforeExpr ?? '')}</del> <ins>${escapeHtml(step.afterExpr ?? '')}</ins></code>`
            : `<code class="qc-tooltip-expr qc-expr">${escapeHtml(step.expr ?? '')}</code>`;
          return (
            `<li class="qc-tooltip-item is-${toneOf(step.change)}">` +
            `<span class="qc-tooltip-line">${mark}<span class="qc-tooltip-text">${text}</span>${tooltipTargetHtml(step, changed)}</span>` +
            expr +
            `</li>`
          );
        }

        const tooltipSectionHtml = (label, tone, steps) =>
          `<div class="qc-tooltip-section">` +
          `<div class="qc-tooltip-label is-${tone}">${label}</div>` +
          `<ul class="qc-tooltip-items">` +
          (steps.length > 0
            ? steps.map((step) => tooltipItemHtml(step)).join('')
            : '<li class="qc-tooltip-empty">なし</li>') +
          `</ul></div>`;

        /**
         * The panel hangs off the Action list, inside the drawer's own bounds:
         * 12px in from the drawer's right edge and exactly 12px narrower than
         * the drawer, so the canvas, the resize edge and the floating menu are
         * never under it. Vertically it prefers the open space below the row and
         * flips above only when that space is the shorter one, so the row and
         * its detail button stay clickable. A caret ties it to that button.
         */
        function positionTooltip() {
          const action = detailAction();
          const open = drawerOpen();
          const item = action ? actionListEl.querySelector(`[data-action="${action.id}"]`) : null;
          const rowHidden = Boolean(item?.closest('.qc-action-row')?.hidden);
          // Collapsed drawer, filtered row, or nothing picked: no panel at all.
          if (!action || !open || !item || rowHidden) {
            tooltipEl.hidden = true;
            caretEl.hidden = true;
            return;
          }
          tooltipEl.hidden = false;
          /*
           * The slotted drawer and panel report the body as their offsetParent,
           * so their real containing block (the frame's canvas) is measured
           * directly. Both are absolute children of that canvas, so its
           * coordinates are the panel's own.
           */
          const canvasEl = panel.shadowRoot?.querySelector('[part~="canvas"]') ?? panel;
          const canvasRect = canvasEl.getBoundingClientRect();
          const gap = 6;
          /**
           * Point the caret at the detail button, at the panel edge that faces
           * the row. Layout offsets, not rects: the entrance animation scales
           * the panel for its first 150ms, and a rect would inherit that.
           */
          const placeCaret = (top) => {
            const buttonEl = item.closest('.qc-action-row')?.querySelector('[data-action-detail]') ?? item;
            const buttonRect = buttonEl.getBoundingClientRect();
            const panelTop = top;
            const panelHeight = tooltipEl.offsetHeight;
            const side = panelTop >= rowBottom ? 'up' : panelTop + panelHeight <= rowTop ? 'down' : null;
            if (side === null) {
              caretEl.hidden = true;
              return;
            }
            const left = tooltipEl.offsetLeft;
            const width = tooltipEl.offsetWidth;
            const wanted = buttonRect.left + buttonRect.width / 2 - canvasRect.left;
            // 14px in from either corner, so the caret never clips the radius.
            const x = Math.round(Math.min(Math.max(wanted, left + 14), left + width - 14));
            // The caret's own centre sits on the panel edge that faces the row.
            const edge = side === 'up' ? panelTop : panelTop + panelHeight;
            caretEl.hidden = false;
            caretEl.dataset.side = side;
            caretEl.style.left = `${x}px`;
            caretEl.style.top = `${Math.round(edge - 5)}px`;
            // It grows out of the button, not out of the panel's own middle.
            tooltipEl.style.transformOrigin = `${x}px ${side === 'up' ? 0 : panelHeight}px`;
          };
          // The scrollable list: from below the drawer's header to the frame's bottom.
          const listRect = actionListWrapEl.getBoundingClientRect();
          const listTop = listRect.top - canvasRect.top;
          const listBottom = canvasRect.height - 12;
          const rowRect = item.getBoundingClientRect();
          const rowTop = rowRect.top - canvasRect.top;
          const rowBottom = rowRect.bottom - canvasRect.top;
          // The tallest the panel may be while keeping 6px of air at both ends.
          tooltipEl.style.maxHeight = `${Math.max(140, Math.floor(listBottom - listTop - 12))}px`;

          // The row scrolled right out of view: pin the panel to the list's top.
          if (rowBottom <= listTop || rowTop >= listBottom) {
            const top = Math.round(listTop + 8);
            tooltipEl.style.maxHeight = `${Math.max(140, Math.floor(listBottom - (listTop + 8)))}px`;
            tooltipEl.style.top = `${top}px`;
            caretEl.hidden = true;
            return;
          }

          const spaceBelow = listBottom - (rowBottom + gap);
          const spaceAbove = rowTop - gap - (listTop + 6);
          // Measured with the widest cap on, so this is the panel's own height.
          const naturalHeight = tooltipEl.scrollHeight;
          // Below by default: the panel then reads on from the row it describes.
          if (spaceBelow >= Math.min(naturalHeight, 220) || spaceBelow >= spaceAbove) {
            const top = Math.max(listTop + 6, rowBottom + gap);
            tooltipEl.style.maxHeight = `${Math.max(140, Math.floor(listBottom - top))}px`;
            tooltipEl.style.top = `${Math.round(top)}px`;
            placeCaret(Math.round(top));
            return;
          }
          // No room left below: flip it over the row, its bottom edge on the gap.
          tooltipEl.style.maxHeight = `${Math.max(140, Math.floor(spaceAbove))}px`;
          const height = tooltipEl.offsetHeight;
          const top = Math.round(Math.max(listTop + 6, rowTop - gap - height));
          tooltipEl.style.top = `${top}px`;
          placeCaret(top);
        }

        function renderTooltip() {
          const action = detailAction();
          if (!action) {
            tooltipEl.hidden = true;
            tooltipEl.innerHTML = '';
            return;
          }
          const showRemoved = state.mode === 'diff';
          const guards = action.guards.filter((step) => showRemoved || step.change !== 'removed');
          const writes = action.writes.filter((step) => showRemoved || step.change !== 'removed');
          // `最新` prints only what stays: a removed model is not "unchanged".
          const unchanged = action.unchangedModels.filter(
            (modelId) => showRemoved || diff.modelById.get(modelId)?.change !== 'removed',
          );
          tooltipEl.innerHTML =
            // The title bar belongs to the panel, not to the Action.
            `<div class="qc-tooltip-bar">` +
            `<span class="qc-tooltip-bar-label">Action 詳細</span>` +
            `<button type="button" class="qc-tooltip-close" aria-label="詳細を閉じる" title="閉じる">` +
            `<svg viewBox="0 0 14 14" width="14" height="14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round">` +
            `<path d="M3.8 3.8l6.4 6.4"></path><path d="M10.2 3.8l-6.4 6.4"></path>` +
            `</svg></button>` +
            `</div>` +
            `<div class="qc-tooltip-body">` +
            `<div class="qc-tooltip-head">` +
            `<span class="qc-tooltip-name">${escapeHtml(action.name)}(${escapeHtml(action.params)})</span>` +
            `<span class="qc-tooltip-chips"><span class="qc-kind is-${action.kind}">${escapeHtml(action.kind)}</span>${diffChip(action.change)}</span>` +
            `</div>` +
            `<p class="qc-tooltip-summary">${escapeHtml(action.summary)}</p>` +
            `<p class="qc-tooltip-meta">${unchanged.length > 0 ? `unchanged: ${escapeHtml(unchanged.join(', '))}` : '全モデル更新'}</p>` +
            tooltipSectionHtml('事前条件 (Read)', 'read', guards) +
            tooltipSectionHtml('状態更新 (Write)', 'write', writes) +
            `</div>`;
          tooltipEl.scrollTop = 0;
          positionTooltip();
        }

        /* ---------------- interaction handlers ---------------- */
        function setMode(mode) {
          if (state.mode === mode) return;
          state.mode = mode;
          rootEl.dataset.mode = mode;
          modeButtons.forEach((button) => button.setAttribute('aria-pressed', String(button.dataset.mode === mode)));
          tagFilterEl.tags = tagOptions();
          renderCards();
          updateSubject();
          renderActionList();
          renderTooltip();
          // After mode drops a removed model, so the world is a different height.
          layoutWorld();
          panel.apply();
          if (state.bcFocus.length > 0) fitFocus();
        }

        function setPanelCollapsed(collapsed) {
          state.panelCollapsed = collapsed;
          drawerEl.hidden = collapsed;
          panel.classList.toggle('has-drawer', !collapsed);
          togglePanelBtn.setAttribute('aria-expanded', String(!collapsed));
          togglePanelBtn.setAttribute('aria-pressed', String(!collapsed));
          setDrawerWidth(state.drawerWidth);
          // The canvas changed shape: re-apply, and re-fit a focused BC into
          // what is left of it.
          window.requestAnimationFrame(() => {
            panel.apply();
            if (state.bcFocus.length > 0) fitFocus();
          });
        }

        function clearSelection() {
          state.lockedAction = null;
          state.hoveredAction = null;
          state.detailAction = null;
          state.lockedErd = null;
          state.hoveredErd = null;
          applyVisuals();
          renderTooltip();
          syncPicked();
        }

        function pickErd(erd) {
          state.lockedErd = sameErd(state.lockedErd, erd) ? null : erd;
          state.hoveredErd = null;
          state.lockedAction = null;
          state.hoveredAction = null;
          state.detailAction = null;
          applyVisuals();
          renderTooltip();
          syncPicked();
        }

        /* Hovering only lights the touched models: it never opens the popover. */
        function onListOver(event) {
          if (state.lockedAction) return;
          const item = event.target.closest('[data-action]');
          if (!item || item.closest('.qc-action-row')?.hidden) return;
          if (state.hoveredAction === item.dataset.action) return;
          state.hoveredAction = item.dataset.action;
          applyVisuals();
        }

        function onListLeave() {
          if (state.lockedAction || !state.hoveredAction) return;
          state.hoveredAction = null;
          applyVisuals();
        }

        /* A row click locks the canvas highlight, and closes any open popover. */
        function onListClick(event) {
          const item = event.target.closest('[data-action]');
          if (!item) return;
          const id = item.dataset.action;
          state.lockedAction = state.lockedAction === id ? null : id;
          state.hoveredAction = null;
          state.detailAction = null;
          state.lockedErd = null;
          state.hoveredErd = null;
          applyVisuals();
          renderTooltip();
          syncPicked();
        }

        /* The one way in: the row's own detail button, never a hover or a row click. */
        function onDetailClick(event) {
          const btn = event.target.closest('[data-action-detail]');
          if (!btn) return;
          event.preventDefault();
          event.stopPropagation();
          const id = btn.dataset.actionDetail;
          if (state.detailAction === id) {
            // Same button again: close, and keep the canvas highlight as it is.
            state.detailAction = null;
            applyVisuals();
            renderTooltip();
            return;
          }
          state.detailAction = id;
          state.lockedAction = id;
          state.hoveredAction = null;
          state.lockedErd = null;
          state.hoveredErd = null;
          applyVisuals();
          renderTooltip();
          syncPicked();
        }

        function onWorldOver(event) {
          const hit = event.target.closest('[data-erd]');
          if (!hit) {
            if (state.hoveredErd && !state.lockedAction && !state.lockedErd) {
              state.hoveredErd = null;
              applyVisuals();
            }
            return;
          }
          if (state.lockedErd || state.lockedAction) return;
          const next = parseErd(hit.dataset.erd);
          if (sameErd(state.hoveredErd, next)) return;
          state.hoveredErd = next;
          applyVisuals();
        }

        function onWorldLeave() {
          if (state.lockedErd || state.lockedAction || !state.hoveredErd) return;
          state.hoveredErd = null;
          applyVisuals();
        }

        function onWorldClick(event) {
          const hit = event.target.closest('[data-erd]');
          // An empty-canvas click is the panel's own `dpk-canvas-dismiss`.
          if (!hit) return;
          pickErd(parseErd(hit.dataset.erd));
        }

        function onWorldKeydown(event) {
          if (event.key !== 'Enter' && event.key !== ' ') return;
          const hit = event.target.closest('[data-erd]');
          if (!hit) return;
          event.preventDefault();
          pickErd(parseErd(hit.dataset.erd));
        }

        /* ---------------- wiring ---------------- */
        worldEl.addEventListener('mouseover', onWorldOver);
        worldEl.addEventListener('mouseleave', onWorldLeave);
        worldEl.addEventListener('click', onWorldClick);
        worldEl.addEventListener('keydown', onWorldKeydown);
        actionListEl.addEventListener('mouseover', onListOver);
        actionListEl.addEventListener('mouseleave', onListLeave);
        actionListEl.addEventListener('click', onListClick);
        // The detail button lives beside the row button: give it its own branch.
        actionListEl.addEventListener('click', onDetailClick);
        // Scrolling the list moves the row, and the popover follows it.
        actionListWrapEl.addEventListener('scroll', () => positionTooltip(), { passive: true });

        // The popover's own close button is rebuilt with its content, so listen here.
        tooltipEl.addEventListener('click', (event) => {
          if (!event.target.closest('.qc-tooltip-close')) return;
          state.detailAction = null;
          applyVisuals();
          renderTooltip();
        });

        /*
         * The popover floats over the drawer, so it isolates its own gestures
         * as well: a wheel turn scrolls it, and a press or a click inside it
         * never pans, zooms or dismisses the canvas underneath.
         */
        for (const type of ['wheel', 'pointerdown', 'pointerup', 'click']) {
          tooltipEl.addEventListener(type, (event) => event.stopPropagation(), { passive: type === 'wheel' });
        }

        /*
         * The drawer is docked over the canvas, so it owns its gestures: a
         * wheel turn scrolls the list, a press or a click selects a row —
         * none of them pans, zooms or dismisses the canvas underneath.
         */
        for (const type of ['wheel', 'pointerdown', 'pointerup', 'click']) {
          drawerEl.addEventListener(type, (event) => event.stopPropagation(), { passive: type === 'wheel' });
        }
        // The canvas hears a click in the capture phase, before the drawer can
        // stop it: remember where the press began instead.
        document.addEventListener(
          'pointerdown',
          (event) => {
            const path = event.composedPath();
            pressInDrawer = path.includes(drawerEl) || path.includes(tooltipEl);
          },
          true,
        );
        document.addEventListener(
          'keydown',
          () => {
            pressInDrawer = false;
          },
          true,
        );

        panel.addEventListener('dpk-canvas-dismiss', (event) => {
          if (pressInDrawer) {
            event.preventDefault();
            return;
          }
          if (!state.lockedAction && !state.lockedErd) return;
          clearSelection();
          // Cancel it: Escape cleared the selection, so it must not also restore.
          event.preventDefault();
        });

        // Maximizing resizes the canvas, so a focused BC is re-fitted into the new
        // unobstructed area (the drawer's width is unchanged, the canvas is not).
        panel.addEventListener('dpk-maximize-change', () => {
          window.requestAnimationFrame(() => {
            panel.apply();
            if (state.bcFocus.length > 0) fitFocus();
            positionTooltip();
          });
        });

        // Escape anywhere in the frame clears the lock first (capture: the panel's
        // own restore-on-Escape listens in the bubble phase and respects this).
        panel.addEventListener(
          'keydown',
          (event) => {
            if (event.key !== 'Escape') return;
            if (event.target === searchInput && searchInput.value) {
              searchInput.value = '';
              state.search = '';
              applyVisuals();
              event.preventDefault();
              return;
            }
            if (!state.lockedAction && !state.lockedErd) return;
            clearSelection();
            event.preventDefault();
          },
          true,
        );

        toggleBcBtn.addEventListener('click', () => {
          state.bcFrames = !state.bcFrames;
          toggleBcBtn.setAttribute('aria-pressed', String(state.bcFrames));
          bcLayerEl.hidden = !state.bcFrames;
        });
        toggleExprBtn.addEventListener('click', () => {
          state.showExpr = !state.showExpr;
          toggleExprBtn.setAttribute('aria-pressed', String(state.showExpr));
          rootEl.dataset.showExpr = String(state.showExpr);
          // Expressions change each card's height, so re-stack and resize the world.
          layoutWorld();
          panel.apply();
          if (state.bcFocus.length > 0) fitFocus();
          // The card's own height changed with the folded expressions: re-anchor.
          positionTooltip();
        });
        modeButtons.forEach((button) => {
          button.addEventListener('click', () => setMode(button.dataset.mode));
        });
        togglePanelBtn.addEventListener('click', () => setPanelCollapsed(!state.panelCollapsed));

        /*
         * The drawer's left edge is a separator: drag it, press the arrows, or
         * double-click to go back to 400px. Each path writes `--qc-drawer-w`
         * only, so the drawer, the legend and `::part(controls)` move together.
         */
        let dragPointer = null;
        let dragStartWidth = 0;
        function endDrawerDrag() {
          if (dragPointer === null) return;
          dragPointer = null;
          drawerResizeEl.classList.remove('is-dragging');
          drawerEl.classList.remove('is-resizing');
          document.body.style.removeProperty('cursor');
          document.body.style.removeProperty('user-select');
          setDrawerWidth(state.drawerWidth, { refit: state.drawerWidth !== dragStartWidth });
        }
        drawerResizeEl.addEventListener('pointerdown', (event) => {
          if (event.button !== 0) return;
          event.stopPropagation();
          dragPointer = event.pointerId;
          dragStartWidth = state.drawerWidth;
          drawerResizeEl.classList.add('is-dragging');
          drawerEl.classList.add('is-resizing');
          document.body.style.cursor = 'ew-resize';
          document.body.style.userSelect = 'none';
          try {
            drawerResizeEl.setPointerCapture(event.pointerId);
          } catch {
            // A synthetic pointer has no capture to take; the move handler is enough.
          }
        });
        drawerResizeEl.addEventListener('pointermove', (event) => {
          if (dragPointer === null || event.pointerId !== dragPointer) return;
          // Measured from the frame's right edge, so the left edge follows the pointer.
          const rect = panel.getBoundingClientRect();
          setDrawerWidth(rect.right - event.clientX);
          event.preventDefault();
        });
        for (const type of ['pointerup', 'pointercancel', 'lostpointercapture']) {
          drawerResizeEl.addEventListener(type, (event) => {
            event.stopPropagation();
            endDrawerDrag();
          });
        }
        drawerResizeEl.addEventListener('keydown', (event) => {
          const step = event.shiftKey ? DRAWER.bigStep : DRAWER.step;
          let next = null;
          if (event.key === 'ArrowLeft') next = state.drawerWidth + step;
          else if (event.key === 'ArrowRight') next = state.drawerWidth - step;
          else if (event.key === 'Home') next = DRAWER.min;
          else if (event.key === 'End') next = drawerLimit();
          if (next === null) return;
          event.preventDefault();
          event.stopPropagation();
          setDrawerWidth(next, { refit: true });
        });
        drawerResizeEl.addEventListener('dblclick', (event) => {
          event.preventDefault();
          event.stopPropagation();
          setDrawerWidth(DRAWER.initial, { refit: true });
        });
        clearBtn.addEventListener('click', clearSelection);
        searchInput.addEventListener('input', () => {
          window.clearTimeout(searchTimer);
          searchTimer = window.setTimeout(() => {
            state.search = searchInput.value;
            applyVisuals();
          }, 110);
        });
        tagFilterEl.addEventListener('dpk-tag-filter-change', onTagChange);

        /* ---------------- layout readiness ---------------- */
        /*
         * A hidden page measures every card at 0px, so a layout taken then is
         * garbage. `layoutMeasurable()` is the gate: while it is false the layout
         * is marked stale, and the first moment the page has real dimensions the
         * whole world is re-stacked and the opening view is re-taken.
         */
        const layoutMeasurable = () =>
          panel.clientWidth >= 8 &&
          [...cardsEl.querySelectorAll('[data-model]')].every((card) => card.offsetHeight > 0);

        function relayoutNow() {
          if (!layoutMeasurable()) {
            state.layoutStale = true;
            return false;
          }
          layoutWorld();
          state.layoutStale = false;
          if (state.bcFocus.length > 0) fitFocus();
          else resetView();
          // A page can come back with fresh card geometry: re-anchor the card.
          positionTooltip();
          return true;
        }

        let showTimer = 0;
        function scheduleShowRelayout() {
          window.clearTimeout(showTimer);
          let attempts = 0;
          const attempt = () => {
            // Already measured and stacked: a same-page hash change must not move the view.
            if (!state.layoutStale && layoutMeasurable()) return;
            if (relayoutNow()) return;
            attempts += 1;
            // A page can un-hide a frame or two before its cards have a height.
            if (attempts < 12) showTimer = window.setTimeout(attempt, 80);
          };
          showTimer = window.setTimeout(attempt, 40);
        }

        function handleResize() {
          if (panel.clientWidth < 8) {
            state.layoutStale = true;
            return;
          }
          // A narrower frame may no longer allow the picked width: clamp it first.
          setDrawerWidth(state.drawerWidth);
          if (state.layoutStale) {
            relayoutNow();
            return;
          }
          panel.apply();
          if (state.bcFocus.length > 0) fitFocus();
          positionTooltip();
        }

        /* ---------------- boot ---------------- */
        function boot() {
          panel.classList.toggle('has-drawer', !state.panelCollapsed);
          drawerEl.hidden = state.panelCollapsed;
          setDrawerWidth(state.drawerWidth);
          seedTagFilter();
          updateSubject();
          renderCards();
          renderActionList();
          renderTooltip();
          layoutWorld();
          applyVisuals();
          syncPicked();
          watchCanvas();
          if (layoutMeasurable()) {
            state.layoutStale = false;
            // The panel opens the view itself once it has the content box; this
            // only re-takes it after a deferred call landed before that.
            resetView();
          } else {
            state.layoutStale = true;
            scheduleShowRelayout();
          }
        }

        const observer = new ResizeObserver(handleResize);
        observer.observe(panel);
        /*
         * The canvas is the popover's containing block, and maximizing both
         * moves the panel's own box and replays its entrance animation (a
         * transform, so rects inside are scaled until it ends). Watch the
         * canvas and the panel's animation end, so the placement is re-measured
         * after that layout rather than guessed from a frame.
         */
        function watchCanvas() {
          const canvasEl = panel.shadowRoot?.querySelector('[part~="canvas"]');
          if (!canvasEl) {
            window.requestAnimationFrame(watchCanvas);
            return;
          }
          if (typeof ResizeObserver !== 'undefined') new ResizeObserver(() => positionTooltip()).observe(canvasEl);
          canvasEl.closest('.panel')?.addEventListener('animationend', () => {
            window.requestAnimationFrame(() => positionTooltip());
          });
        }
        // Some engines deliver ResizeObserver only with a frame; the window event
        // is the second path to the same handler.
        let resizeTimer = 0;
        window.addEventListener('resize', () => {
          window.clearTimeout(resizeTimer);
          resizeTimer = window.setTimeout(handleResize, 80);
        });

        // Page switches: dpk-app toggles [hidden] on dpk-page, so watch the page and
        // its view, plus the hash / navigate events the shell uses for :page= links.
        const pageEl = rootEl.closest('dpk-page');
        const pageObserver = new MutationObserver(scheduleShowRelayout);
        if (pageEl) {
          pageObserver.observe(pageEl, { attributes: true, attributeFilter: ['hidden', 'style', 'class'] });
          const viewEl = pageEl.closest('dpk-view-plain');
          if (viewEl) pageObserver.observe(viewEl, { attributes: true, attributeFilter: ['hidden', 'style', 'class'] });
        }
        window.addEventListener('hashchange', scheduleShowRelayout);
        window.addEventListener('dpk-navigate', scheduleShowRelayout);
        document.addEventListener('dpk-navigate', scheduleShowRelayout);
        document.addEventListener('visibilitychange', () => {
          if (!document.hidden) scheduleShowRelayout();
        });

        if (document.fonts?.ready) {
          document.fonts.ready.then(() => {
            if (layoutMeasurable()) {
              layoutWorld();
              state.layoutStale = false;
              panel.apply();
              if (state.bcFocus.length > 0) fitFocus();
            } else {
              state.layoutStale = true;
              scheduleShowRelayout();
            }
          });
        }

        // The panel only owns a camera once the element is upgraded; open the
        // view (100%, the declared `initial`) when it is.
        if (customElements.get('dpk-dialog-panel')) boot();
        else customElements.whenDefined('dpk-dialog-panel').then(boot);
      }

      if (typeof document !== 'undefined') {
        renderQuintDiffPage();
        loadQuintDiagram();
      }
    </script>
  </body>
</html>
