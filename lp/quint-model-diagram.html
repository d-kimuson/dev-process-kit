<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <title>Quint モデル図 — BC 別の State モデルと Action | dev-process-kit</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      dpk-app {
        display: block;
        height: 100%;
      }

      /* The root stays hidden until the kit upgrades it, so the light DOM never
         flashes before the first paint; the animation is a safety net for a
         bundle that never arrives. */
      body > :not(:defined) {
        visibility: hidden;
        animation: dpk-reveal 0s 2s forwards;
      }
      @keyframes dpk-reveal {
        to {
          visibility: visible;
        }
      }
      [hidden] {
        display: none !important;
      }

      /* =====================================================================
         Design system: --dpk-* tokens only, light and dark.
         ===================================================================== */
      /*
       * One frame, not a stack of them: the whole view is a single
       * `<dpk-dialog-panel>` and this root only gives it the page height.
       */
      .qc-root {
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        width: 100%;
        height: calc(100vh - 96px);
        min-height: 480px;
        padding: 0 16px 16px;
        color: var(--dpk-ink);
        font-family: var(--dpk-body);
        font-size: 12.5px;
        line-height: 1.5;
      }

      .qc-panel {
        flex: 1 1 auto;
        min-height: 0;
        /* The canvas needs a definite height to fill; the root gives it one. */
        --dpk-dialog-panel-height: 100%;
        --dpk-dialog-panel-padding: 0;
      }

      /* The header's right-hand menu: search, mode toggle, drawer toggle. */
      .qc-actions {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .qc-group {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }

      /* A compact `dpk-input` in the header's menu. */
      .qc-search {
        display: flex;
        align-items: center;
        gap: 5px;
        color: var(--dpk-ink-faint);
      }
      .qc-search input {
        width: 208px;
        height: 26px;
        min-height: 26px;
        padding: 0 8px;
        font-size: 11.5px;
      }
      .qc-search input::placeholder {
        color: var(--dpk-ink-faint);
      }
      .qc-search svg {
        width: 12px;
        height: 12px;
        flex-shrink: 0;
      }

      .qc-toggle,
      .qc-btn {
        appearance: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        height: 26px;
        padding: 0 9px;
        border: 1px solid var(--dpk-rule);
        border-radius: 999px;
        background: var(--dpk-paper-sunken);
        color: var(--dpk-ink-soft);
        font-family: var(--dpk-body);
        font-size: 11.5px;
        font-weight: 550;
        line-height: 1;
        cursor: pointer;
        white-space: nowrap;
        transition:
          border-color 120ms var(--dpk-ease),
          background 120ms var(--dpk-ease),
          color 120ms var(--dpk-ease);
      }
      .qc-toggle:hover,
      .qc-btn:hover {
        border-color: var(--dpk-rule-strong);
        color: var(--dpk-ink);
        background: var(--dpk-paper-raised);
      }
      .qc-toggle[aria-pressed='true'] {
        border-color: color-mix(in srgb, var(--dpk-accent) 45%, transparent);
        background: var(--dpk-accent-soft);
        color: var(--dpk-accent);
      }
      .qc-toggle[data-tone='amber'][aria-pressed='true'] {
        border-color: color-mix(in srgb, var(--dpk-amber) 45%, transparent);
        background: var(--dpk-amber-soft);
        color: var(--dpk-amber);
      }
      .qc-toggle[data-tone='green'][aria-pressed='true'] {
        border-color: color-mix(in srgb, var(--dpk-green) 45%, transparent);
        background: var(--dpk-green-soft);
        color: var(--dpk-green);
      }
      .qc-btn {
        border-radius: var(--dpk-radius-sm);
      }
      .qc-btn--danger {
        border-color: color-mix(in srgb, var(--dpk-danger) 42%, transparent);
        background: var(--dpk-danger-soft);
        color: var(--dpk-danger);
      }
      .qc-btn svg {
        width: 12px;
        height: 12px;
        flex-shrink: 0;
      }

      .qc-seg {
        display: inline-flex;
        gap: 2px;
        padding: 2px;
        border: 1px solid var(--dpk-rule);
        border-radius: var(--dpk-radius-sm);
        background: var(--dpk-paper-sunken);
      }
      .qc-seg button {
        appearance: none;
        border: 0;
        background: transparent;
        color: var(--dpk-ink-soft);
        font-family: var(--dpk-body);
        font-size: 11px;
        font-weight: 550;
        line-height: 1;
        padding: 4px 8px;
        border-radius: var(--dpk-radius-xs);
        cursor: pointer;
        white-space: nowrap;
        transition:
          background 120ms var(--dpk-ease),
          color 120ms var(--dpk-ease);
      }
      .qc-seg button:hover {
        color: var(--dpk-ink);
      }
      .qc-seg button[aria-pressed='true'] {
        background: var(--dpk-paper-raised);
        color: var(--dpk-ink);
        box-shadow: var(--dpk-shadow-xs);
      }
      .qc-seg button[aria-pressed='true'][data-tone='diff'] {
        color: var(--dpk-amber);
      }

      .qc-chip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 2px 7px;
        border: 1px solid var(--dpk-rule);
        border-radius: 999px;
        background: var(--dpk-paper-sunken);
        color: var(--dpk-ink-soft);
        font-size: 10.5px;
        font-weight: 600;
        line-height: 1.35;
        white-space: nowrap;
      }
      .qc-chip--mono {
        font-family: var(--dpk-mono);
        font-weight: 550;
      }
      .qc-chip--faint {
        background: transparent;
        color: var(--dpk-ink-faint);
        font-weight: 500;
      }
      .qc-chip--blue {
        border-color: color-mix(in srgb, var(--dpk-blue) 34%, transparent);
        background: var(--dpk-blue-soft);
        color: var(--dpk-blue);
      }
      .qc-chip--green {
        border-color: color-mix(in srgb, var(--dpk-green) 36%, transparent);
        background: var(--dpk-green-soft);
        color: var(--dpk-green);
      }
      .qc-chip--amber {
        border-color: color-mix(in srgb, var(--dpk-amber) 38%, transparent);
        background: var(--dpk-amber-soft);
        color: var(--dpk-amber);
      }
      .qc-chip--violet {
        border-color: color-mix(in srgb, var(--dpk-violet) 36%, transparent);
        background: var(--dpk-violet-soft);
        color: var(--dpk-violet);
      }
      .qc-chip--danger {
        border-color: color-mix(in srgb, var(--dpk-danger) 38%, transparent);
        background: var(--dpk-danger-soft);
        color: var(--dpk-danger);
      }

      /* The one tag-filter row, in the panel's own toolbar slot. */
      .qc-tagbar {
        display: block;
        padding: 7px 12px;
        border-bottom: 1px solid var(--dpk-rule);
        background: var(--dpk-paper);
      }
      .qc-root dpk-tag-filter {
        display: block;
        min-width: 0;
        font-size: 11.5px;
      }

      /* =====================================================================
         The world inside the canvas: BC frames, model cards, cross band.
         `--dpk-zoom-scale` is set by `<dpk-dialog-panel>` on the world, so the
         group labels counter-scale themselves below 100%.
         ===================================================================== */
      .qc-world {
        position: relative;
        width: 100%;
        height: 100%;
      }

      .qc-bc {
        position: absolute;
        box-sizing: border-box;
        border: 1.5px solid color-mix(in srgb, var(--dpk-ink-faint) 35%, transparent);
        border-radius: var(--dpk-radius);
        background: color-mix(in srgb, var(--dpk-paper-inset) 35%, transparent);
        pointer-events: none;
        transition: opacity 160ms var(--dpk-ease);
      }
      /* Counter-scaled like `src/boards/er-diagram/styles.ts` so the label never
         shrinks under its authored size at a fitted zoom below 100%. */
      .qc-bc-label {
        position: absolute;
        left: 12px;
        top: 6px;
        padding: 2px 9px;
        border-radius: 999px;
        background: var(--dpk-paper-inset);
        color: var(--dpk-ink-soft);
        font-family: var(--dpk-mono);
        font-size: 10.5px;
        font-weight: 600;
        white-space: nowrap;
        transform-origin: top left;
        /* Capped: at a fitted zoom the label would otherwise grow past its own
           frame and collide with the next BC's label. */
        transform: scale(clamp(1, calc(1 / var(--dpk-zoom-scale, 1)), 1.7));
      }
      .qc-bc-label b {
        font-weight: 700;
        color: var(--dpk-ink);
      }
      .qc-bc-label span {
        font-family: var(--dpk-body);
        font-weight: 500;
        color: var(--dpk-ink-faint);
        margin-left: 5px;
      }

      .qc-cross-band {
        position: absolute;
        box-sizing: border-box;
        /* Room for the counter-scaled label at its cap, so it never touches a card. */
        padding: 52px 10px 10px;
        border: 1.5px dashed color-mix(in srgb, var(--dpk-amber) 38%, transparent);
        border-radius: var(--dpk-radius);
        background: color-mix(in srgb, var(--dpk-amber-soft) 24%, transparent);
      }
      .qc-cross-label {
        position: absolute;
        left: 12px;
        top: 6px;
        padding: 2px 9px;
        border-radius: 999px;
        background: var(--dpk-paper-inset);
        color: var(--dpk-amber);
        font-family: var(--dpk-mono);
        font-size: 10.5px;
        font-weight: 600;
        white-space: nowrap;
        transform-origin: top left;
        /* Same cap as the BC labels, with the band's top padding sized for it. */
        transform: scale(clamp(1, calc(1 / var(--dpk-zoom-scale, 1)), 1.7));
      }
      .qc-cross-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 8px;
      }
      @media (max-width: 1240px) {
        .qc-cross-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      /* =====================================================================
         Model cards: ERD geometry with always-on diff and zero layout shift.
         ===================================================================== */
      .qc-card {
        position: absolute;
        width: 300px;
        box-sizing: border-box;
        border: 1px solid var(--dpk-rule-strong);
        border-radius: var(--dpk-radius);
        background: var(--dpk-paper-raised);
        box-shadow: var(--dpk-bevel), var(--dpk-shadow-sm);
        overflow: hidden;
        cursor: pointer;
        transition:
          opacity 160ms var(--dpk-ease),
          box-shadow 160ms var(--dpk-ease),
          border-color 160ms var(--dpk-ease);
      }
      .qc-card:hover {
        border-color: color-mix(in srgb, var(--dpk-ink-faint) 70%, var(--dpk-rule-strong));
      }
      .qc-card.is-added {
        border-color: color-mix(in srgb, var(--dpk-green) 60%, transparent);
      }
      .qc-card.is-removed {
        border-style: dashed;
        border-color: color-mix(in srgb, var(--dpk-danger) 55%, transparent);
      }
      .qc-card.is-changed {
        border-color: color-mix(in srgb, var(--dpk-amber) 55%, transparent);
      }
      .qc-card.is-active {
        box-shadow:
          inset 0 0 0 1.5px var(--dpk-accent),
          var(--dpk-shadow-sm),
          0 0 0 3px color-mix(in srgb, var(--dpk-accent) 24%, transparent);
      }
      .qc-card.is-related {
        box-shadow:
          inset 0 0 0 1px color-mix(in srgb, var(--dpk-accent) 55%, transparent),
          var(--dpk-shadow-sm);
      }
      .qc-card.is-search-hit {
        box-shadow:
          inset 0 0 0 1.5px color-mix(in srgb, var(--dpk-blue) 70%, transparent),
          var(--dpk-shadow-sm);
      }
      .qc-card.is-label-hit {
        box-shadow:
          inset 0 0 0 1.5px color-mix(in srgb, var(--dpk-ink-faint) 55%, transparent),
          var(--dpk-shadow-sm);
      }

      .qc-card-head {
        padding: 6px 9px 5px;
        border-bottom: 1px solid var(--dpk-rule);
        background: color-mix(in srgb, var(--dpk-paper-inset) 60%, var(--dpk-paper-raised));
      }
      .qc-head-top {
        display: flex;
        align-items: center;
        gap: 5px;
        height: 18px;
        min-width: 0;
      }
      .qc-model-icon {
        width: 13px;
        height: 13px;
        color: var(--dpk-accent);
        flex-shrink: 0;
      }
      .qc-model-name {
        font-family: var(--dpk-mono);
        font-size: 12.5px;
        font-weight: 700;
        color: var(--dpk-ink);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .qc-card.is-removed .qc-model-name {
        text-decoration: line-through;
      }
      .qc-model-jp {
        font-size: 10.5px;
        color: var(--dpk-ink-soft);
        white-space: nowrap;
        flex-shrink: 0;
      }
      .qc-head-gw {
        margin-left: auto;
      }
      /* Fixed-height sub-row: the signature and the pre-reserved `unchanged`
         pill. Toggling the pill's visibility never changes the row's height. */
      .qc-head-sub {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        height: 20px;
        margin-top: 2px;
        min-width: 0;
      }
      .qc-sig {
        min-width: 0;
        padding: 1px 6px;
        border: 1px solid var(--dpk-rule);
        border-radius: 999px;
        background: var(--dpk-paper-raised);
        color: var(--dpk-ink-faint);
        font-family: var(--dpk-mono);
        font-size: 9.5px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex: 0 1 auto;
      }
      .qc-unchanged {
        display: inline-flex;
        align-items: center;
        height: 18px;
        padding: 0 6px;
        box-sizing: border-box;
        border: 1px dashed var(--dpk-rule-strong);
        border-radius: 999px;
        background: var(--dpk-paper-raised);
        color: var(--dpk-ink-faint);
        font-family: var(--dpk-mono);
        font-size: 9px;
        font-weight: 600;
        white-space: nowrap;
        visibility: hidden;
        flex-shrink: 0;
      }
      .qc-unchanged.is-on {
        visibility: visible;
      }

      .qc-diff-chip {
        display: inline-flex;
        align-items: center;
        height: 16px;
        padding: 0 5px;
        border-radius: 999px;
        border: 1px solid transparent;
        font-family: var(--dpk-mono);
        font-size: 9px;
        font-weight: 700;
        white-space: nowrap;
        flex-shrink: 0;
      }
      .qc-diff-chip.is-added {
        border-color: color-mix(in srgb, var(--dpk-green) 40%, transparent);
        background: var(--dpk-green-soft);
        color: var(--dpk-green);
      }
      .qc-diff-chip.is-removed {
        border-color: color-mix(in srgb, var(--dpk-danger) 40%, transparent);
        background: var(--dpk-danger-soft);
        color: var(--dpk-danger);
      }
      .qc-diff-chip.is-changed {
        border-color: color-mix(in srgb, var(--dpk-amber) 42%, transparent);
        background: var(--dpk-amber-soft);
        color: var(--dpk-amber);
      }
      .qc-head-top .qc-diff-chip {
        margin-left: auto;
      }
      .qc-head-top .qc-head-gw + .qc-diff-chip {
        margin-left: 0;
      }

      .qc-fields {
        list-style: none;
        margin: 0;
        padding: 3px 0;
      }
      /* Fixed single-line geometry: mark / name / type / 38px R·W slot. */
      .qc-field {
        display: grid;
        grid-template-columns: 11px minmax(0, 1fr) auto 38px;
        align-items: center;
        gap: 4px;
        height: 22px;
        margin: 0 4px;
        padding: 0 6px;
        border-radius: 4px;
        font-size: 11.5px;
        transition: background 120ms var(--dpk-ease), box-shadow 120ms var(--dpk-ease);
      }
      .qc-root[data-mode='after'] .qc-field {
        grid-template-columns: minmax(0, 1fr) auto 38px;
      }
      .qc-field:hover {
        background: var(--dpk-paper-sunken);
      }
      .qc-field.is-added {
        background: var(--dpk-green-soft);
      }
      .qc-field.is-removed {
        background: var(--dpk-danger-soft);
      }
      .qc-field.is-changed {
        background: var(--dpk-amber-soft);
      }
      .qc-field.is-removed .qc-field-name,
      .qc-field.is-removed .qc-field-type {
        text-decoration: line-through;
      }
      .qc-mark {
        font-family: var(--dpk-mono);
        font-size: 10px;
        font-weight: 700;
        text-align: center;
        line-height: 1;
      }
      .qc-mark.is-added {
        color: var(--dpk-green);
      }
      .qc-mark.is-removed {
        color: var(--dpk-danger);
      }
      .qc-mark.is-changed {
        color: var(--dpk-amber);
      }
      .qc-field-main {
        display: flex;
        align-items: center;
        gap: 4px;
        min-width: 0;
      }
      .qc-field-name {
        font-family: var(--dpk-mono);
        font-weight: 550;
        color: var(--dpk-ink);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .qc-tag {
        padding: 1px 4px;
        border-radius: 4px;
        font-family: var(--dpk-mono);
        font-size: 8.5px;
        font-weight: 700;
        letter-spacing: 0.02em;
        flex-shrink: 0;
      }
      .qc-tag--key {
        background: var(--dpk-amber-soft);
        color: var(--dpk-amber);
      }
      .qc-tag--ref {
        background: var(--dpk-blue-soft);
        color: var(--dpk-blue);
      }
      .qc-field-type {
        max-width: 118px;
        color: var(--dpk-ink-faint);
        font-family: var(--dpk-mono);
        font-size: 10px;
        text-align: right;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .qc-field-type del {
        color: var(--dpk-danger);
        text-decoration: line-through;
      }
      .qc-field-type ins {
        color: var(--dpk-green);
        text-decoration: none;
      }
      .qc-gw {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 38px;
        height: 18px;
        box-sizing: border-box;
        border: 1px solid transparent;
        border-radius: 999px;
        font-family: var(--dpk-mono);
        font-size: 9px;
        font-weight: 700;
        line-height: 1;
        visibility: hidden;
        flex-shrink: 0;
      }
      /* R / W / R·W — the same three words as the bottom-left legend and the
         Action list: Read is blue, Write is green, both is violet. */
      .qc-gw.is-r {
        visibility: visible;
        border-color: color-mix(in srgb, var(--dpk-blue) 38%, transparent);
        background: var(--dpk-blue-soft);
        color: var(--dpk-blue);
      }
      .qc-gw.is-w {
        visibility: visible;
        border-color: color-mix(in srgb, var(--dpk-green) 42%, transparent);
        background: var(--dpk-green-soft);
        color: var(--dpk-green);
      }
      .qc-gw.is-rw {
        visibility: visible;
        border-color: color-mix(in srgb, var(--dpk-violet) 44%, transparent);
        background: var(--dpk-violet-soft);
        color: var(--dpk-violet);
      }
      .qc-field.is-r {
        box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--dpk-blue) 45%, transparent);
      }
      .qc-field.is-w {
        box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--dpk-green) 48%, transparent);
      }
      .qc-field.is-rw {
        box-shadow: inset 0 0 0 1.2px color-mix(in srgb, var(--dpk-violet) 55%, transparent);
      }
      .qc-field.is-field-active {
        box-shadow: inset 0 0 0 1.5px var(--dpk-accent);
      }
      .qc-field.is-inv-ref {
        box-shadow: inset 0 0 0 1.2px color-mix(in srgb, var(--dpk-amber) 55%, transparent);
      }
      .qc-field.is-search-hit {
        box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--dpk-blue) 65%, transparent);
      }

      /* Local invariants footer inside each card. */
      .qc-invs {
        display: flex;
        flex-direction: column;
        gap: 3px;
        padding: 4px 6px 5px;
        border-top: 1px solid var(--dpk-rule);
        background: color-mix(in srgb, var(--dpk-amber-soft) 26%, var(--dpk-paper-sunken));
      }
      .qc-invs-label {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 0 3px;
        color: var(--dpk-amber);
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .qc-inv-icon {
        width: 10px;
        height: 10px;
        flex-shrink: 0;
      }
      .qc-inv {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 2px 5px;
        border: 1px solid transparent;
        border-radius: var(--dpk-radius-xs);
        background: color-mix(in srgb, var(--dpk-paper-raised) 78%, transparent);
        cursor: pointer;
        transition:
          border-color 120ms var(--dpk-ease),
          box-shadow 120ms var(--dpk-ease);
      }
      .qc-inv:hover {
        border-color: color-mix(in srgb, var(--dpk-amber) 45%, transparent);
      }
      .qc-inv.is-added {
        border-color: color-mix(in srgb, var(--dpk-green) 42%, transparent);
      }
      .qc-inv.is-removed {
        border-color: color-mix(in srgb, var(--dpk-danger) 42%, transparent);
        border-style: dashed;
      }
      .qc-inv.is-changed {
        border-color: color-mix(in srgb, var(--dpk-amber) 45%, transparent);
      }
      .qc-inv.is-active {
        box-shadow: 0 0 0 1.5px var(--dpk-accent);
      }
      .qc-inv.is-inv-hit {
        border-color: color-mix(in srgb, var(--dpk-amber) 70%, transparent);
        background: color-mix(in srgb, var(--dpk-amber-soft) 60%, var(--dpk-paper-raised));
      }
      .qc-inv.is-search-hit {
        box-shadow: 0 0 0 1.5px color-mix(in srgb, var(--dpk-blue) 65%, transparent);
      }
      .qc-inv-top {
        display: flex;
        align-items: center;
        gap: 4px;
        min-width: 0;
      }
      .qc-inv-title {
        flex: 1 1 auto;
        min-width: 0;
        color: var(--dpk-ink);
        font-size: 9.5px;
        line-height: 1.3;
      }
      .qc-inv.is-removed .qc-inv-title {
        text-decoration: line-through;
      }
      .qc-status {
        display: inline-flex;
        align-items: center;
        gap: 2px;
        padding: 1px 5px;
        border-radius: 999px;
        font-family: var(--dpk-mono);
        font-size: 8.5px;
        font-weight: 700;
        line-height: 1.4;
        white-space: nowrap;
        flex-shrink: 0;
      }
      .qc-status del {
        opacity: 0.65;
        text-decoration: line-through;
      }
      .qc-status--verified {
        background: var(--dpk-green-soft);
        color: var(--dpk-green);
      }
      .qc-status--bounded {
        background: var(--dpk-blue-soft);
        color: var(--dpk-blue);
      }
      .qc-status--planned {
        background: var(--dpk-amber-soft);
        color: var(--dpk-amber);
      }
      .qc-inv-expr {
        padding: 2px 5px;
        border-radius: 4px;
        background: var(--dpk-paper-inset);
        color: var(--dpk-ink-soft);
        font-family: var(--dpk-mono);
        font-size: 9px;
        line-height: 1.45;
        word-break: break-word;
      }
      .qc-root[data-show-expr='false'] .qc-expr {
        display: none;
      }
      .qc-bound {
        align-self: flex-start;
        padding: 1px 5px;
        border: 1px solid color-mix(in srgb, var(--dpk-blue) 28%, transparent);
        border-radius: var(--dpk-radius-xs);
        background: var(--dpk-blue-soft);
        color: var(--dpk-blue);
        font-family: var(--dpk-mono);
        font-size: 8.5px;
        line-height: 1.4;
        word-break: break-word;
      }

      /* Cross-model invariants band. */
      .qc-cross-card {
        display: flex;
        flex-direction: column;
        gap: 3px;
        min-width: 0;
        padding: 6px 8px;
        border: 1px solid color-mix(in srgb, var(--dpk-amber) 38%, var(--dpk-rule));
        border-radius: var(--dpk-radius);
        background: var(--dpk-paper-raised);
        box-shadow: var(--dpk-bevel), var(--dpk-shadow-xs);
        cursor: pointer;
        transition:
          border-color 120ms var(--dpk-ease),
          box-shadow 120ms var(--dpk-ease),
          opacity 160ms var(--dpk-ease);
      }
      .qc-cross-card.is-added {
        border-color: color-mix(in srgb, var(--dpk-green) 55%, transparent);
      }
      .qc-cross-card.is-changed {
        border-color: color-mix(in srgb, var(--dpk-amber) 60%, transparent);
      }
      .qc-cross-card.is-active {
        box-shadow: inset 0 0 0 1.5px var(--dpk-accent);
      }
      .qc-cross-card.is-inv-hit {
        border-color: color-mix(in srgb, var(--dpk-amber) 75%, transparent);
        background: color-mix(in srgb, var(--dpk-amber-soft) 45%, var(--dpk-paper-raised));
      }
      .qc-cross-card.is-search-hit {
        box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--dpk-blue) 70%, transparent);
      }
      .qc-cross-id .qc-mark {
        flex-shrink: 0;
      }
      .qc-cross-id {
        display: flex;
        align-items: center;
        gap: 4px;
        min-width: 0;
        color: var(--dpk-amber);
        font-family: var(--dpk-mono);
        font-size: 10px;
        font-weight: 700;
        overflow-wrap: anywhere;
      }
      .qc-cross-title {
        color: var(--dpk-ink);
        font-size: 10.5px;
        font-weight: 600;
        line-height: 1.4;
      }
      .qc-cross-card.is-removed .qc-cross-title {
        text-decoration: line-through;
      }
      .qc-cross-refs {
        display: flex;
        flex-wrap: wrap;
        gap: 3px;
      }
      .qc-cross-ref {
        padding: 1px 4px;
        border-radius: 4px;
        background: var(--dpk-paper-sunken);
        color: var(--dpk-ink-faint);
        font-family: var(--dpk-mono);
        font-size: 8.5px;
        white-space: nowrap;
      }

      /* Canvas HUD */
      /* =====================================================================
         Slots over the canvas: the glass legend, and the docked drawer.
         ===================================================================== */
      .qc-overlay {
        display: contents;
      }

      /* Bottom-left, in the manner of the boards' own `.diagram-legend`. */
      .qc-legend {
        position: absolute;
        left: 12px;
        bottom: 14px;
        z-index: 2;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 12px;
        max-width: calc(100% - 260px);
        padding: 4px 8px;
        border: 1px solid var(--dpk-rule);
        border-radius: var(--dpk-radius-xs);
        background: var(--dpk-glass);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        box-shadow: var(--dpk-shadow-xs);
        color: var(--dpk-ink-faint);
        font-size: 9.5px;
        pointer-events: none;
      }
      .qc-panel.has-drawer .qc-legend {
        max-width: calc(100% - var(--qc-drawer-w, 400px) - 260px);
      }
      .qc-legend-item {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        white-space: nowrap;
      }
      .qc-root[data-mode='after'] .qc-legend-diff {
        display: none;
      }

      /*
       * The Action matrix and its detail panel, docked to the right edge of the
       * canvas inside the one double-duty frame: collapsing it gives the whole
       * canvas back, maximizing keeps it docked in the top-layer view.
       */
      .qc-drawer {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        z-index: 3;
        display: flex;
        flex-direction: column;
        /* Width is the reader's: the handle writes --qc-drawer-w (280px–640px). */
        width: var(--qc-drawer-w, 400px);
        max-width: 100%;
        box-sizing: border-box;
        /* Square edges: the panel clips its own frame; nothing to round here. */
        border-radius: 0;
        border-left: 1px solid var(--dpk-rule);
        background: var(--dpk-paper-raised);
        box-shadow: -1px 0 0 var(--dpk-highlight) inset;
      }
      /* Full-height drag edge on the drawer's left border. */
      .qc-drawer-resize {
        position: absolute;
        top: 0;
        bottom: 0;
        left: -4px;
        z-index: 4;
        width: 9px;
        border: 0;
        padding: 0;
        background: transparent;
        cursor: ew-resize;
        touch-action: none;
        outline: none;
      }
      .qc-drawer-resize::before {
        content: '';
        position: absolute;
        top: 0;
        bottom: 0;
        left: 50%;
        width: 2px;
        transform: translateX(-50%);
        background: transparent;
        transition: background 120ms var(--dpk-ease);
      }
      .qc-drawer-resize:hover::before,
      .qc-drawer-resize:focus-visible::before,
      .qc-drawer-resize.is-dragging::before {
        background: var(--dpk-accent);
      }
      .qc-drawer-resize:focus-visible::before {
        width: 3px;
      }
      .qc-drawer-head {
        display: flex;
        flex-wrap: nowrap;
        align-items: center;
        justify-content: space-between;
        gap: 6px 10px;
        flex-shrink: 0;
        /* 14px, the same inset every Action row keeps below. */
        padding: 10px 14px;
        border-bottom: 1px solid var(--dpk-rule);
        border-radius: 0;
        background: var(--dpk-paper-sunken);
      }
      /* Maximized, the panel's own exit-fullscreen button sits at the top right. */
      #quint-panel[maximized] .qc-drawer-head {
        padding-right: 48px;
      }
      .qc-drawer-title {
        font-size: 11px;
        font-weight: 700;
        color: var(--dpk-ink);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .qc-drawer-count {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        min-width: 18px;
        height: 16px;
        margin-left: auto;
        padding: 0 5px;
        border: 1px solid var(--dpk-rule);
        border-radius: 999px;
        background: var(--dpk-paper-raised);
        color: var(--dpk-ink-faint);
        font-family: var(--dpk-mono);
        font-size: 9px;
        font-weight: 700;
        line-height: 1;
      }

      /*
       * The floating menu keeps out from under the drawer: shifted left by the
       * drawer's own width, at both the inline corner and the maximized centre.
       */
      #quint-panel.has-drawer::part(controls) {
        right: calc(var(--qc-drawer-w, 400px) + 12px);
        left: auto;
        transform: none;
      }
      #quint-panel.has-drawer[maximized]::part(controls) {
        right: calc(var(--qc-drawer-w, 400px) + 12px);
        left: auto;
        transform: none;
      }

      /*
       * The diagram's own buttons ride in that menu, so they take the menu's
       * own look (28px, transparent, accent when pressed) rather than the
       * pill-shaped header style.
       */
      .qc-controls {
        display: flex;
        align-items: center;
        gap: 2px;
      }
      .qc-controls .qc-toggle,
      .qc-controls .qc-btn {
        height: 28px;
        padding: 0 8px;
        border: 0;
        border-radius: var(--dpk-radius-sm);
        background: transparent;
        color: var(--dpk-ink-soft);
        font-size: 10.5px;
        font-weight: 600;
      }
      .qc-controls .qc-toggle:hover,
      .qc-controls .qc-btn:hover {
        background: var(--dpk-paper-inset);
        border: 0;
        color: var(--dpk-ink);
      }
      .qc-controls .qc-toggle[aria-pressed='true'] {
        background: var(--dpk-accent-soft);
        color: var(--dpk-accent);
      }
      .qc-controls .qc-toggle[data-tone='amber'][aria-pressed='true'] {
        background: var(--dpk-amber-soft);
        color: var(--dpk-amber);
      }
      .qc-controls .qc-btn--danger {
        background: transparent;
        color: var(--dpk-danger);
      }
      .qc-controls .qc-btn--danger:hover {
        background: var(--dpk-danger-soft);
        color: var(--dpk-danger);
      }

      /* =====================================================================
         Action list + detail panel.
         ===================================================================== */
      .qc-right-body {
        display: flex;
        flex: 1 1 auto;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
      }
      /* The Action list: one clean row per Action. No table, no BC columns —
         each row says which Quint models the Action touches and how. */
      .qc-action-list-wrap {
        flex: 1 1 auto;
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 0;
        overflow-x: hidden;
        overflow-y: auto;
        overscroll-behavior: contain;
        background: var(--dpk-paper);
      }
      .qc-action-list {
        display: flex;
        flex-direction: column;
        width: 100%;
        min-width: 0;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .qc-action-row {
        position: relative;
        min-width: 0;
        border-bottom: 1px solid var(--dpk-rule);
      }
      /* The detail button is a sibling of the row button: no nested buttons. */
      .qc-action-detail-btn {
        position: absolute;
        top: 8px;
        right: 8px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 22px;
        height: 22px;
        padding: 0;
        border: 1px solid transparent;
        border-radius: var(--dpk-radius-xs);
        background: transparent;
        color: var(--dpk-ink-faint);
        cursor: pointer;
        transition:
          color 120ms var(--dpk-ease),
          border-color 120ms var(--dpk-ease),
          background 120ms var(--dpk-ease);
      }
      .qc-action-detail-btn:hover {
        border-color: var(--dpk-rule);
        background: var(--dpk-paper-raised);
        color: var(--dpk-ink);
      }
      .qc-action-detail-btn:focus-visible {
        outline: 2px solid var(--dpk-accent);
        outline-offset: 1px;
      }
      /* Open: the button owns the accent, so the row it describes is obvious. */
      .qc-action-detail-btn[aria-expanded='true'] {
        border-color: color-mix(in srgb, var(--dpk-accent) 45%, transparent);
        background: var(--dpk-accent-soft);
        color: var(--dpk-accent);
      }
      /* Crossing onto the button keeps the row lit; the button covers its box.
         :where() keeps the weight low, so a locked/active row still wins. */
      .qc-action-row:where(:hover) .qc-action-item {
        background: var(--dpk-paper-sunken);
      }
      .qc-action-row:last-child {
        border-bottom: 0;
      }
      .qc-action-item {
        appearance: none;
        display: flex;
        flex-direction: column;
        gap: 5px;
        min-width: 0;
        width: 100%;
        box-sizing: border-box;
        margin: 0;
        /* The right gutter is the detail button's: it sits on the row's top line. */
        padding: 10px 34px 10px 14px;
        border: 0;
        border-radius: 0;
        background: transparent;
        color: var(--dpk-ink);
        font-family: var(--dpk-body);
        font-size: 11px;
        text-align: left;
        cursor: pointer;
        transition:
          background 120ms var(--dpk-ease),
          opacity 140ms var(--dpk-ease),
          box-shadow 120ms var(--dpk-ease);
      }
      .qc-action-item:hover,
      .qc-action-item.is-active {
        background: var(--dpk-paper-sunken);
      }
      .qc-action-item.is-locked {
        background: var(--dpk-accent-soft);
        box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--dpk-accent) 60%, transparent);
      }
      .qc-action-item.is-search {
        box-shadow: inset 0 0 0 1.2px color-mix(in srgb, var(--dpk-blue) 50%, transparent);
      }
      /* A locked model/field/invariant points at the Actions that touch it. */
      .qc-action-item.is-erd-hit {
        background: color-mix(in srgb, var(--dpk-accent-soft) 55%, transparent);
        box-shadow: inset 0 0 0 1.2px color-mix(in srgb, var(--dpk-accent) 45%, transparent);
      }
      .qc-action-item.is-dimmed {
        opacity: 0.38;
      }
      .qc-action-head {
        display: flex;
        align-items: center;
        gap: 5px;
        min-width: 0;
      }
      .qc-action-name {
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--dpk-ink);
        font-family: var(--dpk-mono);
        font-size: 10.5px;
        font-weight: 650;
      }
      .qc-action-item[data-status='removed'] .qc-action-name {
        text-decoration: line-through;
        color: var(--dpk-ink-soft);
      }
      .qc-action-summary {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--dpk-ink-faint);
        font-size: 9px;
        line-height: 1.3;
      }
      .qc-action-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 3px;
        min-width: 0;
      }
      .qc-mchip {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        max-width: 100%;
        padding: 1px 6px;
        border: 1px solid var(--dpk-rule);
        border-radius: 999px;
        background: var(--dpk-paper-sunken);
        color: var(--dpk-ink-soft);
        font-family: var(--dpk-mono);
        font-size: 9px;
        font-weight: 600;
        line-height: 1.5;
        white-space: nowrap;
      }
      .qc-mchip--r {
        border-color: color-mix(in srgb, var(--dpk-blue) 32%, transparent);
        background: var(--dpk-blue-soft);
        color: var(--dpk-blue);
      }
      .qc-mchip--w {
        border-color: color-mix(in srgb, var(--dpk-green) 34%, transparent);
        background: var(--dpk-green-soft);
        color: var(--dpk-green);
      }
      .qc-mchip--rw {
        border-color: color-mix(in srgb, var(--dpk-violet) 34%, transparent);
        background: var(--dpk-violet-soft);
        color: var(--dpk-violet);
      }
      .qc-mchip-kind {
        font-weight: 750;
        letter-spacing: 0.02em;
      }
      .qc-mchip.is-bc-focus {
        border-color: currentColor;
        box-shadow: 0 0 0 1px color-mix(in srgb, currentColor 45%, transparent);
      }
      .qc-mchip.is-removed {
        border-style: dashed;
      }
      .qc-mchip.is-removed .qc-mchip-name {
        text-decoration: line-through;
      }
      .qc-mchip-mark {
        font-weight: 750;
      }
      .qc-kind {
        padding: 0 4px;
        border-radius: 999px;
        background: var(--dpk-paper-sunken);
        border: 1px solid var(--dpk-rule);
        color: var(--dpk-ink-faint);
        font-family: var(--dpk-mono);
        font-size: 8px;
        font-weight: 700;
        line-height: 1.5;
        flex-shrink: 0;
      }
      .qc-kind.is-async {
        border-color: color-mix(in srgb, var(--dpk-violet) 35%, transparent);
        background: var(--dpk-violet-soft);
        color: var(--dpk-violet);
      }
      .qc-kind.is-init {
        border-color: color-mix(in srgb, var(--dpk-blue) 35%, transparent);
        background: var(--dpk-blue-soft);
        color: var(--dpk-blue);
      }

      /* =====================================================================
         Action detail: a panel a button opened, not a hover tooltip.
         It hangs off the row's detail button — a caret, a title bar and a
         short grow-in — inside the drawer's own bounds (12px in from either
         edge), so the model canvas, the resize edge and the floating menu
         are never under it, and opening it never shifts a row by a pixel.
         ===================================================================== */
      .qc-tooltip {
        position: absolute;
        top: 12px;
        /* The drawer's right edge owns the 12px inset; the width keeps the left one. */
        right: 12px;
        /* Above the drawer (3) and its resize edge (4): it floats over rows. */
        z-index: 6;
        box-sizing: border-box;
        width: calc(var(--qc-drawer-w, 400px) - 24px);
        max-width: calc(var(--qc-drawer-w, 400px) - 24px);
        max-height: calc(100% - 76px);
        overflow-x: hidden;
        overflow-y: auto;
        overscroll-behavior: contain;
        padding: 0;
        border: 1px solid var(--dpk-rule-strong);
        border-radius: var(--dpk-radius);
        background: var(--dpk-paper-raised);
        box-shadow: var(--dpk-bevel), var(--dpk-shadow-lg);
        color: var(--dpk-ink);
        /* Growing out of the button that opened it: no ghost, no fade-in-place. */
        animation: qc-detail-in 150ms var(--dpk-ease-out);
      }
      @keyframes qc-detail-in {
        from {
          opacity: 0;
          transform: translateY(-3px) scale(0.985);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .qc-tooltip {
          animation: none;
        }
      }
      /* The panel's own title bar: a surface, not a floating label. */
      .qc-tooltip-bar {
        position: sticky;
        top: 0;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 7px 8px 7px 16px;
        border-bottom: 1px solid var(--dpk-rule);
        border-radius: calc(var(--dpk-radius) - 1px) calc(var(--dpk-radius) - 1px) 0 0;
        background: var(--dpk-paper-sunken);
      }
      .qc-tooltip-bar-label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--dpk-ink-soft);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.05em;
      }
      /* The caret is a sibling of the panel: the panel scrolls, the caret does not. */
      .qc-detail-caret {
        position: absolute;
        z-index: 5;
        width: 10px;
        height: 10px;
        border: 1px solid var(--dpk-rule-strong);
        pointer-events: none;
        transform: translate(-50%, 0) rotate(45deg);
      }
      /* Opening below the row: the tip points up, into the button. */
      .qc-detail-caret[data-side='up'] {
        border-right: 0;
        border-bottom: 0;
        border-radius: 2px 0 0 0;
        background: var(--dpk-paper-sunken);
      }
      /* Flipped above the row: the tip points down, out of the panel's body. */
      .qc-detail-caret[data-side='down'] {
        border-left: 0;
        border-top: 0;
        border-radius: 0 0 2px 0;
        background: var(--dpk-paper-raised);
      }
        font-family: var(--dpk-body);
        /* Opened by an explicit click, so it is always the reader's to scroll. */
        pointer-events: auto;
      }
      .qc-tooltip-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 8px;
        margin-bottom: 6px;
      }
      /* The panel's own way out: a button on the title bar, not a tooltip glyph. */
      .qc-tooltip-close {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        width: 22px;
        height: 22px;
        padding: 0;
        border: 1px solid var(--dpk-rule);
        border-radius: var(--dpk-radius-xs);
        background: var(--dpk-paper-raised);
        color: var(--dpk-ink-faint);
        cursor: pointer;
        transition:
          color 120ms var(--dpk-ease),
          border-color 120ms var(--dpk-ease),
          background 120ms var(--dpk-ease);
      }
      .qc-tooltip-close:hover {
        border-color: var(--dpk-rule-strong);
        background: var(--dpk-paper-sunken);
        color: var(--dpk-ink);
      }
      .qc-tooltip-close:focus-visible {
        outline: 2px solid var(--dpk-accent);
        outline-offset: 1px;
      }
      /* Everything under the title bar, on the panel's own padding. */
      .qc-tooltip-body {
        padding: 12px 16px 14px;
      }
      .qc-tooltip-name {
        flex: 1 1 100%;
        min-width: 0;
        color: var(--dpk-ink);
        font-family: var(--dpk-mono);
        font-size: 13px;
        font-weight: 650;
        line-height: 1.4;
        overflow-wrap: anywhere;
      }
      .qc-tooltip-chips {
        display: inline-flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 5px;
      }
      .qc-tooltip-summary {
        margin: 0 0 10px;
        color: var(--dpk-ink-soft);
        font-size: 12px;
        line-height: 1.5;
        overflow-wrap: anywhere;
      }
      /* Plain metadata, not a pill: the models this Action leaves untouched. */
      .qc-tooltip-meta {
        margin: 0;
        color: var(--dpk-ink-faint);
        font-size: 11px;
        line-height: 1.5;
        overflow-wrap: anywhere;
      }
      .qc-tooltip-section {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid var(--dpk-rule);
      }
      .qc-tooltip-label {
        margin-bottom: 6px;
        color: var(--dpk-ink-soft);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .qc-tooltip-label.is-read {
        color: var(--dpk-blue);
      }
      .qc-tooltip-label.is-write {
        color: var(--dpk-green);
      }
      .qc-tooltip-items {
        display: flex;
        flex-direction: column;
        gap: 2px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .qc-tooltip-item {
        display: block;
        padding: 5px 8px;
        border-radius: var(--dpk-radius-xs);
        background: transparent;
      }
      /* The tint is the only diff chrome: no borders around rows or groups. */
      .qc-tooltip-item.is-added {
        background: color-mix(in srgb, var(--dpk-green-soft) 70%, transparent);
      }
      .qc-tooltip-item.is-removed {
        background: color-mix(in srgb, var(--dpk-danger-soft) 70%, transparent);
      }
      .qc-tooltip-item.is-changed {
        background: color-mix(in srgb, var(--dpk-amber-soft) 55%, transparent);
      }
      .qc-tooltip-line {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 3px 8px;
        min-width: 0;
      }
      .qc-tooltip-text {
        flex: 1 1 140px;
        min-width: 0;
        color: var(--dpk-ink);
        font-size: 12px;
        line-height: 1.45;
        overflow-wrap: anywhere;
      }
      .qc-tooltip-text del {
        color: var(--dpk-danger);
        text-decoration: line-through;
      }
      .qc-tooltip-text ins {
        color: var(--dpk-ink);
        text-decoration: none;
      }
      .qc-tooltip-item.is-removed .qc-tooltip-text {
        color: var(--dpk-ink-soft);
        text-decoration: line-through;
      }
      .qc-tooltip-arrow {
        flex-shrink: 0;
        color: var(--dpk-ink-faint);
        font-size: 10.5px;
      }
      /* At the 280px drawer it has to give way: wrap, never push the row wide. */
      .qc-tooltip-target {
        flex: 0 1 auto;
        min-width: 0;
        margin-left: auto;
        color: var(--dpk-ink-faint);
        font-family: var(--dpk-mono);
        font-size: 10px;
        line-height: 1.5;
        overflow-wrap: anywhere;
      }
      .qc-tooltip-target code {
        font: inherit;
      }
      /* Raw Quint stays folded away until the Quint式 toggle is on. */
      .qc-tooltip-expr {
        display: block;
        margin-top: 3px;
        padding: 2px 5px;
        border-radius: 4px;
        background: var(--dpk-paper-inset);
        color: var(--dpk-ink-soft);
        font-family: var(--dpk-mono);
        font-size: 9px;
        line-height: 1.45;
        overflow-wrap: anywhere;
      }
      .qc-tooltip-item.is-removed .qc-tooltip-expr {
        text-decoration: line-through;
        color: var(--dpk-ink-soft);
      }
      .qc-tooltip-expr del {
        color: var(--dpk-danger);
        text-decoration: line-through;
      }
      .qc-tooltip-expr ins {
        color: var(--dpk-green);
        text-decoration: none;
      }
      .qc-tooltip-item .qc-mark {
        flex-shrink: 0;
      }
      .qc-tooltip-empty {
        padding: 2px 8px;
        color: var(--dpk-ink-faint);
        font-size: 11px;
      }

      /* =====================================================================
         Page 2: unified diff of the Quint module.
         ===================================================================== */
      .qd-doc {
        box-sizing: border-box;
        width: 100%;
        max-width: 1180px;
        margin: 0 auto;
        padding: 4px 20px 64px;
        color: var(--dpk-ink);
        font-family: var(--dpk-body);
        font-size: 13px;
        line-height: 1.65;
      }
      .qd-lead {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-bottom: 10px;
      }
      .qd-lead h2 {
        margin: 0;
        font-size: 15px;
        font-weight: 650;
        letter-spacing: -0.01em;
      }
      .qd-lead p {
        margin: 0;
        color: var(--dpk-ink-soft);
        font-size: 12px;
      }
      .qd-summary {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 8px;
        margin-bottom: 12px;
      }
      .qd-stat {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 8px 10px;
        border: 1px solid var(--dpk-rule);
        border-radius: var(--dpk-radius);
        background: var(--dpk-paper-raised);
        box-shadow: var(--dpk-bevel), var(--dpk-shadow-xs);
      }
      .qd-stat-label {
        color: var(--dpk-ink-faint);
        font-size: 9.5px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }
      .qd-stat-value {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px;
        color: var(--dpk-ink);
        font-family: var(--dpk-mono);
        font-size: 11px;
      }
      .qd-card {
        overflow: hidden;
        border: 1px solid var(--dpk-rule);
        border-radius: var(--dpk-radius-lg);
        background: var(--dpk-paper-raised);
        box-shadow: var(--dpk-bevel), var(--dpk-shadow-xs);
      }
      .qd-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 6px 10px;
        padding: 9px 12px;
        border-bottom: 1px solid var(--dpk-rule);
        background: var(--dpk-paper-sunken);
      }
      .qd-title {
        color: var(--dpk-ink);
        font-family: var(--dpk-mono);
        font-size: 11.5px;
        font-weight: 700;
      }
      .qd-body {
        overflow-x: auto;
        background: var(--dpk-paper);
        font-family: var(--dpk-mono);
        font-size: 11px;
        line-height: 1.7;
      }
      .qd-line {
        display: flex;
        align-items: flex-start;
        min-width: max-content;
      }
      .qd-ln {
        flex: 0 0 40px;
        padding: 0 5px;
        text-align: right;
        color: var(--dpk-ink-faint);
        user-select: none;
      }
      .qd-sign {
        flex: 0 0 14px;
        text-align: center;
        font-weight: 700;
        color: var(--dpk-ink-faint);
        user-select: none;
      }
      .qd-code {
        flex: 1 1 auto;
        padding-right: 16px;
        color: var(--dpk-ink);
        white-space: pre;
      }
      .qd-line.is-add {
        background: var(--dpk-green-soft);
      }
      .qd-line.is-del {
        background: var(--dpk-danger-soft);
      }
      .qd-line.is-add .qd-sign {
        color: var(--dpk-green);
      }
      .qd-line.is-del .qd-sign {
        color: var(--dpk-danger);
      }
      .qd-line.is-del .qd-code {
        color: var(--dpk-ink-soft);
      }
      .qd-hunk {
        min-width: max-content;
        padding: 2px 10px;
        border-top: 1px solid var(--dpk-rule);
        border-bottom: 1px solid var(--dpk-rule);
        background: var(--dpk-blue-soft);
        color: var(--dpk-blue);
        font-weight: 650;
      }
      .qd-foot {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 10px;
      }

      /* ---- small utilities shared by both pages ---- */
      .qc-count-add {
        color: var(--dpk-green);
        font-weight: 700;
      }
      .qc-count-del {
        color: var(--dpk-danger);
        font-weight: 700;
      }
      .qc-count-chg {
        color: var(--dpk-amber);
        font-weight: 700;
      }
      .qc-count-same {
        color: var(--dpk-ink-faint);
        font-weight: 600;
      }
      .qc-cross-id .qc-status {
        margin-left: auto;
      }
      .qc-tooltip-expr .qc-mark {
        flex-shrink: 0;
      }
      .qc-tooltip-expr code {
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .qc-stat {
        display: inline-flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px;
      }
    </style>
    <script type="module">
      import { loadKit } from './kit.js';
      loadKit(['views/plain.js', 'components.js']);
    </script>
  </head>
  <body>
    <dpk-app storage-key="quint-model-diagram" lang="ja">
      <script type="application/json">
        { "title": "Quint モデル図 — order_fulfillment_v2" }
      </script>

      <dpk-page name="diagram" label="Quint モデル図">
        <dpk-view-plain>
          <script type="application/json">
            {
              "title": "order_fulfillment_v2 — BC別 ERD と Actions",
              "sections": [{ "id": "diagram", "title": "BC別 ERD と Actions" }]
            }
          </script>

          <div
            class="qc-root"
            id="qc-root"
            slot="main"
            data-mode="diff"
            data-show-expr="false"
            data-dpk-target="section:diagram"
          >
            <dpk-dialog-panel
              id="quint-panel"
              class="qc-panel"
              canvas
              maximizable
              resizable
              initial="actual"
              align="center"
              heading="order_fulfillment_v2"
              label="BC別の State モデルと Action 一覧"
            >
              <!-- The one header menu: search, Diff/After, the Actions drawer toggle. -->
              <div slot="actions" class="qc-actions">
                <label class="qc-search">
                  <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
                    <circle cx="7" cy="7" r="4.4"></circle>
                    <path d="M10.4 10.4 14 14"></path>
                  </svg>
                  <input
                    id="qc-search"
                    class="dpk-input"
                    type="search"
                    autocomplete="off"
                    spellcheck="false"
                    placeholder="モデル・属性・Action・不変条件を検索…"
                    aria-label="モデル・属性・Action・不変条件を検索"
                  />
                </label>
                <div class="qc-seg" id="qc-mode" role="group" aria-label="表示モード">
                  <button type="button" data-mode="diff" data-tone="diff" aria-pressed="true">差分</button>
                  <button type="button" data-mode="after" aria-pressed="false">最新</button>
                </div>
                <button
                  type="button"
                  class="qc-toggle"
                  id="qc-toggle-panel"
                  aria-expanded="true"
                  aria-pressed="true"
                  aria-controls="qc-drawer"
                >
                  <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                    <rect x="1.8" y="2.5" width="12.4" height="11" rx="2"></rect>
                    <path d="M10 2.5v11"></path>
                  </svg>
                  <span id="qc-toggle-panel-label">Actions</span>
                </button>
              </div>

              <!-- The one toolbar row: the tag filter, bare, in the panel's row. -->
              <div slot="toolbar" class="qc-tagbar">
                <dpk-tag-filter id="quint-tag-filter" bare aria-label="BC と ラベルで絞り込む"></dpk-tag-filter>
                <!-- Mirror of the visible row's plain-label pick: `passes()` on this
                     instance is what filters models / invariants / actions, so a
                     `BC:*` pick never hides another BC. -->
                <dpk-tag-filter id="quint-label-filter" bare hidden></dpk-tag-filter>
              </div>

              <!-- The world: BC frames, model cards and the cross-model band. -->
              <div class="qc-world" id="qc-world">
                <div id="qc-bc-layer"></div>
                <div id="qc-cards"></div>
                <div class="qc-cross-band" id="qc-cross-band"></div>
              </div>

              <!-- Diagram toggles, in the panel's floating menu beside zoom/maximize. -->
              <div slot="controls" class="qc-controls">
                <button type="button" class="qc-toggle" id="qc-toggle-bc" aria-pressed="true" data-tone="amber">
                  BC枠
                </button>
                <button type="button" class="qc-toggle" id="qc-toggle-expr" aria-pressed="false">Quint式</button>
                <button type="button" class="qc-btn qc-btn--danger" id="qc-clear" hidden>選択解除</button>
              </div>

              <!-- Over the canvas: the legend, and the docked Actions + detail drawer. -->
              <div slot="overlay" class="qc-overlay">
                <div class="qc-legend" aria-label="凡例">
                  <span class="qc-legend-item qc-legend-diff"
                    ><span class="qc-mark is-added" aria-hidden="true">+</span>追加</span
                  >
                  <span class="qc-legend-item qc-legend-diff"
                    ><span class="qc-mark is-removed" aria-hidden="true">−</span>削除</span
                  >
                  <span class="qc-legend-item qc-legend-diff"
                    ><span class="qc-mark is-changed" aria-hidden="true">~</span>変更</span
                  >
                  <span class="qc-legend-item"><span class="qc-chip qc-chip--blue qc-chip--mono">R</span>Read</span>
                  <span class="qc-legend-item"><span class="qc-chip qc-chip--green qc-chip--mono">W</span>Write</span>
                  <span class="qc-legend-item"><span class="qc-chip qc-chip--violet qc-chip--mono">R·W</span>両方</span>
                </div>

                <section class="qc-drawer" id="qc-drawer" aria-label="Actions と Action 詳細">
                  <div
                    class="qc-drawer-resize"
                    id="qc-drawer-resize"
                    role="separator"
                    aria-orientation="vertical"
                    aria-label="Actions パネルの幅を変更"
                    aria-valuemin="280"
                    aria-valuemax="640"
                    aria-valuenow="400"
                    tabindex="0"
                  ></div>
                  <div class="qc-drawer-head">
                    <span class="qc-drawer-title">Actions</span>
                    <span class="qc-drawer-count" id="qc-drawer-count"></span>
                  </div>
                  <div class="qc-right-body">
                    <div class="qc-action-list-wrap" id="qc-action-list-wrap">
                      <ul class="qc-action-list" id="qc-action-list"></ul>
                    </div>
                  </div>
                </section>

                <!-- The Action detail, a panel the row's own button opened. -->
                <div class="qc-detail-caret" id="qc-detail-caret" aria-hidden="true" hidden></div>
                <div class="qc-tooltip" id="qc-action-tooltip" role="dialog" aria-label="Action 詳細" hidden></div>
              </div>
            </dpk-dialog-panel>
          </div>
        </dpk-view-plain>
      </dpk-page>

      <dpk-page name="quint-diff" label="元 Quint 差分（Before → After）">
        <dpk-view-plain>
          <script type="application/json">
            {
              "title": "order_fulfillment_v2.qnt の差分",
              "sections": [{ "id": "quint-diff", "title": "order_fulfillment_v2.qnt の差分" }]
            }
          </script>

          <div class="qd-doc" slot="main" data-dpk-target="section:quint-diff">
            <div class="qd-lead">
              <h2>order_fulfillment_v2.qnt — Before → After</h2>
              <p>
                図が持つ 2 つのスナップショット（QUINT_BEFORE / QUINT_AFTER）から Quint ソースを生成し、行単位の unified
                diff にしたものです。図の差分は同じスナップショットから <code>deriveQuintDiff()</code> で
                導出しているため、図と差分が食い違うことはありません。
              </p>
            </div>
            <div class="qd-summary" id="qd-summary"></div>
            <div class="qd-card">
              <div class="qd-head">
                <span class="qd-title">unified diff — order_fulfillment_v2.qnt</span>
                <span class="qc-group" id="qd-stats"></span>
              </div>
              <div class="qd-body" id="qd-body"></div>
            </div>
            <div class="qd-foot" id="qd-foot"></div>
          </div>
        </dpk-view-plain>
      </dpk-page>
    </dpk-app>

    <script type="module">
      /* ===================================================================
         1. Two canonical snapshots — the only source of truth.
         =================================================================== */
      const BCS = [
        { id: 'Order', label: '注文管理' },
        { id: 'Inventory', label: '在庫・倉庫管理' },
        { id: 'Billing', label: '決済・精算' },
      ];
      const TAG_ORDER = ['今回の変更', '在庫整合', '決済・返金', '非同期', '廃止予定'];

      const QUINT_BEFORE = {
        module: 'order_fulfillment_v2',
        types: [
          { name: 'OrderStatus', variants: ['Pending', 'Paid', 'Cancelled', 'Refunded'] },
          { name: 'PaymentKind', variants: ['Charge', 'Refund'] },
        ],
        constants: [
          { name: 'MAX_STOCK', type: 'int', value: 100 },
          { name: 'TTL', type: 'int', value: 3600 },
        ],
        models: [
          {
            id: 'orders',
            bc: 'Order',
            label: '注文',
            signature: 'OrderId -> Order',
            tags: ['今回の変更', '決済・返金'],
            fields: [
              { name: 'id', type: 'OrderId', key: true, desc: '注文ID' },
              {
                name: 'status',
                type: 'OrderStatus',
                variants: ['Pending', 'Paid', 'Cancelled', 'Refunded'],
                desc: '注文状態',
              },
              { name: 'itemId', type: 'ItemId', ref: 'inventory.itemId', desc: '対象商品' },
              { name: 'qty', type: 'int', desc: '注文数量' },
              { name: 'totalAmount', type: 'int', desc: '合計金額' },
              { name: 'paidAmount', type: 'int', desc: '支払済額' },
              { name: 'refundedAmount', type: 'int', desc: '返金済額' },
            ],
          },
          {
            id: 'inventory',
            bc: 'Inventory',
            label: '在庫',
            signature: 'ItemId -> Stock',
            tags: ['今回の変更', '在庫整合'],
            fields: [
              { name: 'itemId', type: 'ItemId', key: true, desc: '商品ID' },
              { name: 'available', type: 'int', desc: '引当可能数' },
              { name: 'reserved', type: 'int', desc: '予約確保数' },
              { name: 'committed', type: 'int', desc: '出荷確定数' },
              { name: 'legacyBin', type: 'str', desc: '旧ロケーションコード' },
            ],
          },
          {
            id: 'reservations',
            bc: 'Inventory',
            label: '在庫予約',
            signature: 'ResId -> Reservation',
            tags: ['今回の変更', '在庫整合', '非同期'],
            fields: [
              { name: 'id', type: 'ResId', key: true, desc: '予約ID' },
              { name: 'orderId', type: 'OrderId', ref: 'orders.id', desc: '紐づく注文' },
              { name: 'itemId', type: 'ItemId', ref: 'inventory.itemId', desc: '対象商品' },
              { name: 'qty', type: 'int', desc: '予約数量' },
              { name: 'active', type: 'bool', desc: '有効フラグ' },
            ],
          },
          {
            id: 'warehouses',
            bc: 'Inventory',
            label: '倉庫',
            signature: 'WarehouseId -> Warehouse',
            tags: ['在庫整合'],
            fields: [
              { name: 'id', type: 'WarehouseId', key: true, desc: '倉庫ID' },
              { name: 'capacity', type: 'int', desc: '収容キャパシティ' },
              { name: 'active', type: 'bool', desc: '稼働中フラグ' },
            ],
          },
          {
            id: 'payments',
            bc: 'Billing',
            label: '決済台帳',
            signature: 'PaymentId -> Payment',
            tags: ['今回の変更', '決済・返金'],
            fields: [
              { name: 'id', type: 'PaymentId', key: true, desc: '決済ID' },
              { name: 'orderId', type: 'OrderId', ref: 'orders.id', desc: '対象注文' },
              { name: 'kind', type: 'PaymentKind', variants: ['Charge', 'Refund'], desc: '決済種別' },
              { name: 'amount', type: 'int', desc: '金額' },
            ],
          },
          {
            id: 'legacy_invoices',
            bc: 'Billing',
            label: '旧請求書',
            signature: 'InvoiceId -> Invoice',
            tags: ['今回の変更', '廃止予定'],
            fields: [
              { name: 'id', type: 'InvoiceId', key: true, desc: '請求書ID' },
              { name: 'orderId', type: 'OrderId', ref: 'orders.id', desc: '対象注文' },
              { name: 'issuedTotal', type: 'int', desc: '請求合計' },
            ],
          },
        ],
        invariants: [
          {
            id: 'inv_order_amounts',
            scope: 'local',
            model: 'orders',
            title: '返金額 <= 支払額 <= 合計金額',
            expr: '0 <= refundedAmount <= paidAmount <= totalAmount',
            status: 'verified',
            tags: [],
            refs: ['orders.refundedAmount', 'orders.paidAmount', 'orders.totalAmount'],
          },
          {
            id: 'inv_paid_status',
            scope: 'local',
            model: 'orders',
            title: 'Paid 状態なら全額支払済',
            expr: 'status == Paid => paidAmount == totalAmount',
            status: 'verified',
            tags: [],
            refs: ['orders.status', 'orders.paidAmount', 'orders.totalAmount'],
          },
          {
            id: 'inv_non_negative_stock',
            scope: 'local',
            model: 'inventory',
            title: '在庫数はすべて非負',
            expr: 'available >= 0 and reserved >= 0 and committed >= 0',
            status: 'verified',
            tags: [],
            refs: ['inventory.available', 'inventory.reserved', 'inventory.committed'],
          },
          {
            id: 'inv_stock_conservation',
            scope: 'local',
            model: 'inventory',
            title: '総在庫保存則',
            expr: 'available + reserved + committed == MAX_STOCK',
            status: 'verified',
            tags: [],
            refs: ['inventory.available', 'inventory.reserved', 'inventory.committed'],
          },
          {
            id: 'inv_positive_res_qty',
            scope: 'local',
            model: 'reservations',
            title: '予約数量は正の整数',
            expr: 'qty > 0',
            status: 'verified',

      for (const snapshot of [QUINT_BEFORE, QUINT_AFTER]) {

      /* ===================================================================
         2. Pure derivation — every diff mark comes from these two snapshots.
         =================================================================== */
      const CHANGE_ORDER = ['added', 'removed', 'changed', 'same'];
      const MARK = { added: '+', removed: '−', changed: '~', same: '' };
      const CHANGE_LABEL = { added: '+ 追加', removed: '− 削除', changed: '~ 変更', same: '' };

      const variantKey = (variants) => [...new Set(variants ?? [])].sort().join('|');
      const sameFieldGeometry = (a, b) =>
        a.type === b.type &&
        (a.ref ?? null) === (b.ref ?? null) &&
        Boolean(a.key) === Boolean(b.key) &&
        variantKey(a.variants) === variantKey(b.variants);

      const countBy = (items) => {
        const counts = { added: 0, removed: 0, changed: 0, same: 0, total: items.length };
        for (const item of items) counts[item.change] += 1;

      /** Merges two snapshots into one always-on diff. Nothing here reads a hand-authored mark. */
      function deriveQuintDiff(before, after) {
        const beforeModels = new Map(before.models.map((model) => [model.id, model]));
        const afterModels = new Map(after.models.map((model) => [model.id, model]));

        // Column order: after's models first, then the ones only `before` still has,
        // so a removed model stays in its own BC column, at the bottom.
        const modelIds = [];
        const seen = new Set();
        for (const bc of BCS) {
          for (const model of after.models.filter((entry) => entry.bc === bc.id)) {
            if (!seen.has(model.id)) {
              seen.add(model.id);
              modelIds.push(model.id);
            }
          }
          for (const model of before.models.filter((entry) => entry.bc === bc.id)) {
            if (!seen.has(model.id)) {
              seen.add(model.id);
              modelIds.push(model.id);
            }
          }
        }
        for (const model of [...after.models, ...before.models]) {
          if (!seen.has(model.id)) {
            seen.add(model.id);
            modelIds.push(model.id);
          }
        }

        const models = modelIds.map((id) => {
          const b = beforeModels.get(id) ?? null;
          const a = afterModels.get(id) ?? null;
          const base = a ?? b;
          const beforeFields = new Map((b?.fields ?? []).map((field) => [field.name, field]));
          const afterFields = new Map((a?.fields ?? []).map((field) => [field.name, field]));
          const names = [
            ...(a?.fields ?? []).map((field) => field.name),
            ...(b?.fields ?? []).map((field) => field.name).filter((name) => !afterFields.has(name)),
          ];
          const fields = names.map((name) => {
            const bf = beforeFields.get(name) ?? null;
            const af = afterFields.get(name) ?? null;
            const field = af ?? bf;
            const change = !bf ? 'added' : !af ? 'removed' : sameFieldGeometry(bf, af) ? 'same' : 'changed';
            const beforeVariants = new Set(bf?.variants ?? []);
            const afterVariants = new Set(af?.variants ?? []);
            return {
              name,
              change,
              type: field.type,
              key: Boolean(field.key),
              ref: field.ref ?? null,
              variants: field.variants ?? null,
              desc: field.desc ?? '',
              before: bf,
              after: af,
              variantChange: {
                added: [...afterVariants].filter((value) => !beforeVariants.has(value)),
                removed: [...beforeVariants].filter((value) => !afterVariants.has(value)),
              },
            };
          });
          const change = !b
            ? 'added'
            : !a
              ? 'removed'
              : b.signature !== a.signature || fields.some((field) => field.change !== 'same')
                ? 'changed'
                : 'same';
          return {
            id,
            bc: base.bc,
            label: base.label ?? '',
            signature: base.signature ?? '',
            tags: base.tags ?? [],
            change,
            before: b,
            after: a,
            fields,
          };
        });
        const modelById = new Map(models.map((model) => [model.id, model]));

        const beforeInvariants = new Map(before.invariants.map((invariant) => [invariant.id, invariant]));
        const afterInvariants = new Map(after.invariants.map((invariant) => [invariant.id, invariant]));
        const invariantIds = [
          ...after.invariants.map((invariant) => invariant.id),
          ...before.invariants.map((invariant) => invariant.id).filter((id) => !afterInvariants.has(id)),
        ];
        const invariants = invariantIds.map((id) => {
          const b = beforeInvariants.get(id) ?? null;
          const a = afterInvariants.get(id) ?? null;
          const base = a ?? b;
          const bodyChanged =
            Boolean(b && a) && (b.expr !== a.expr || b.status !== a.status || (b.bound ?? '') !== (a.bound ?? ''));
          const change = !b ? 'added' : !a ? 'removed' : bodyChanged ? 'changed' : 'same';
          return {
            id,
            scope: base.scope,
            model: base.model ?? null,
            title: base.title,
            expr: base.expr,
            status: base.status,
            bound: base.bound ?? null,
            tags: base.tags ?? [],
            refs: base.refs ?? [],
            change,
            statusFrom: b?.status ?? null,
            statusTo: a?.status ?? null,
            before: b,
            after: a,
          };
        });
        const invariantById = new Map(invariants.map((invariant) => [invariant.id, invariant]));

        const diffSteps = (beforeSteps, afterSteps) => {
          const b = new Map((beforeSteps ?? []).map((step) => [step.key, step]));
          const a = new Map((afterSteps ?? []).map((step) => [step.key, step]));
          const keys = [
            ...(afterSteps ?? []).map((step) => step.key),
            ...(beforeSteps ?? []).map((step) => step.key).filter((key) => !a.has(key)),
          ];
          return keys.map((key) => {
            const bs = b.get(key) ?? null;
            const as = a.get(key) ?? null;
            const base = as ?? bs;
            const change = !bs
              ? 'added'
              : !as
                ? 'removed'
                : bs.expr !== as.expr || bs.field !== as.field
                  ? 'changed'
                  : 'same';
            return {
              key,
              field: base.field,
              at: base.at ?? null,
              label: base.label ?? '',
              change,
              expr: base.expr,
              beforeExpr: bs?.expr ?? null,
              afterExpr: as?.expr ?? null,
              beforeField: bs?.field ?? null,
              afterField: as?.field ?? null,
              beforeLabel: bs?.label ?? null,
              afterLabel: as?.label ?? null,
              beforeAt: bs?.at ?? null,
              afterAt: as?.at ?? null,
            };
          });
        };

        const beforeActions = new Map(before.actions.map((action) => [action.id, action]));
        const afterActions = new Map(after.actions.map((action) => [action.id, action]));
        const actionIds = [
          ...after.actions.map((action) => action.id),
          ...before.actions.map((action) => action.id).filter((id) => !afterActions.has(id)),
        ];
        const actions = actionIds.map((id) => {
          const b = beforeActions.get(id) ?? null;
          const a = afterActions.get(id) ?? null;
          const base = a ?? b;
          const guards = diffSteps(b?.guards, a?.guards);
          const writes = diffSteps(b?.writes, a?.writes);
          const paramsChanged = (b?.params ?? '') !== (a?.params ?? '');
          const change = !b
            ? 'added'
            : !a
              ? 'removed'
              : paramsChanged ||
                  b.kind !== a.kind ||
                  guards.some((step) => step.change !== 'same') ||
                  writes.some((step) => step.change !== 'same')
                ? 'changed'
                : 'same';
          const anchorOf = (step) => step.at ?? step.field;
          const writeFields = new Set(writes.filter((step) => step.change !== 'removed').map(anchorOf));
          const guardFields = new Set(guards.filter((step) => step.change !== 'removed').map(anchorOf));
          const writeModels = new Set([...writeFields].map((field) => field.split('.')[0]));
          const guardModels = new Set([...guardFields].map((field) => field.split('.')[0]));
          const touchedModels = new Set([...writeModels, ...guardModels]);
          /*
           * Which Quint models each Action reads (a guard) and writes (a
           * write), for the list's chips. Both sides of the diff are read, so
           * an access that only `before` or only `after` has can be marked.
           */
          const accessOf = (phase) => {
            const readSet = new Set();
            const writeSet = new Set();
            const at = (step) =>
              phase === 'before'
                ? (step.beforeAt ?? step.beforeField ?? step.beforeExpr)
                : (step.afterAt ?? step.afterField ?? step.afterExpr);
            const present = (step) => (phase === 'before' ? step.beforeExpr != null : step.afterExpr != null);
            for (const step of guards) {
              if (!present(step)) continue;
              const anchor = at(step);
              if (anchor) readSet.add(anchor.split('.')[0]);
            }
            for (const step of writes) {
              if (!present(step)) continue;
              const anchor = at(step);
              if (anchor) writeSet.add(anchor.split('.')[0]);
            }
            return { reads: readSet, writes: writeSet };
          };
          const beforeAccess = accessOf('before');
          const afterAccess = accessOf('after');
          const kindOf = (set, modelId) => {
            const read = set.reads.has(modelId);
            const write = set.writes.has(modelId);
            return read && write ? 'rw' : write ? 'w' : read ? 'r' : null;
          };
          const access = models
            .map((model) => {
              const beforeKind = kindOf(beforeAccess, model.id);
              const afterKind = kindOf(afterAccess, model.id);
              if (!beforeKind && !afterKind) return null;
              return {
                id: model.id,
                bc: model.bc,
                kind: afterKind ?? beforeKind,
                change: !beforeKind ? 'added' : !afterKind ? 'removed' : 'same',
              };
            })
            .filter(Boolean);
          const accessBcs = new Set(access.map((entry) => entry.bc).filter(Boolean));
          const writeTouches = (ref) => {
            const refModel = ref.split('.')[0];
            for (const field of writeFields) {
              if (field === ref) return true;
              if (!field.includes('.') && field === refModel) return true;
            }
            return false;
          };
          const affectedInvariants = invariants.filter(
