<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <!--
      Hides the root element until it upgrades, so the content inside does not flash
      before the kit paints its chrome (docs/index.md#page-height). The animation is a
      safety net: if the script fails to load, the content still shows after 2s.
    -->
    <style>
      body > :not(:defined) {
        visibility: hidden;
        animation: dpk-reveal 0s 2s forwards;
      }
      @keyframes dpk-reveal {
        to {
          visibility: visible;
        }
      }
    </style>
    <title>注文一覧 API のページング対応 | dev-process-kit</title>
    <!--
      The framework is served from `dist/` by the dev asset server (`pnpm dev`), not
      by this page's own origin: the sample server is a separate origin on purpose,
      so the cross-origin (CORS) load is exercised locally too. A generated page
      loads the same files from jsDelivr instead, and so does this page on GitHub
      Pages or with `?dpk-version=<version>` (`kit.js`).

      A task board the agent rewrites as the work goes on. The main area has
      three tabs — the design docs (each written in Markdown, each with its own
      diagrams and the tasks it groups, opened from a list of titles), what the
      agent asks, and the Kanban board of todos (the agent's own proposals
      under a "?" mark). The left rail holds the outputs (URLs and file paths).
      Questions never stop the work: the agent goes on under an assumption
      unless the question blocks. The reader sets the status of their own todos
      only; the agent reports its own. Replies, decisions and todo changes are
      drafts the reader hands back.
    -->
    <script type="module">
      import { loadKit } from './kit.js';
      loadKit(['views/task-board.js', 'components.js', 'boards.js']);
    </script>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      dpk-app {
        display: block;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <dpk-app>
      <script type="application/json">
        { "title": "注文一覧 API のページング対応" }
      </script>

      <dpk-page name="task-board"
        ><dpk-view-task-board>
          <script type="application/json">
            {
              "title": "注文一覧 API のページング対応",
              "status": "waiting",
              "members": [
                {
                  "id": "claude",
                  "name": "Claude",
                  "kind": "agent"
                },
                {
                  "id": "d-kimuson",
                  "name": "d-kimuson",
                  "kind": "human"
                }
              ],
              "todos": [
                {
                  "id": "requirements",
                  "title": "困っている画面と件数を共有する",
                  "status": "done",
                  "assignee": "d-kimuson",
                  "design": "paging"
                },
                {
                  "id": "survey",
                  "title": "既存の呼び出し元を洗い出す",
                  "status": "done",
                  "assignee": "claude",
                  "design": "paging"
                },
                {
                  "id": "design",
                  "title": "cursor の形式を決める",
                  "status": "done",
                  "assignee": "claude",
                  "note": "created_at と id の組を base64url で包む。",
                  "design": "paging"
                },
                {
                  "id": "impl",
                  "title": "GET /orders を cursor 方式にする",
                  "status": "doing",
                  "assignee": "claude",
                  "note": "上限件数は Q3 の仮回答（100 件）で実装中。",
                  "design": "paging"
                },
                {
                  "id": "tests",
                  "title": "境界値のテストを足す",
                  "status": "doing",
                  "assignee": "claude",
                  "design": "paging"
                },
                {
                  "id": "client",
                  "title": "管理画面の一覧を新しい API に切り替える",
                  "status": "blocked",
                  "note": "旧パラメータの扱い（Q1）が決まるまで保留。",
                  "design": "rollout"
                },
                {
                  "id": "index",
                  "title": "orders に (created_at, id) の複合 index を張る",
                  "status": "todo",
                  "assignee": "claude",
                  "proposed": true,
                  "reason": "今は created_at 単独の index しかなく、同時刻の注文が多い日に並べ替えが遅くなる。",
                  "design": "paging"
                },
                {
                  "id": "csv",
                  "title": "CSV 出力も cursor で回すようにする",
                  "status": "todo",
                  "assignee": "claude",
                  "proposed": true,
                  "reason": "頼まれた範囲ではないが、offset のままだと件数が増えたときに同じく遅くなる。",
                  "design": "rollout"
                },
                {
                  "id": "review",
                  "title": "PR をレビューする",
                  "status": "todo",
                  "assignee": "d-kimuson",
                  "design": "rollout"
                },
                {
                  "id": "staging",
                  "title": "ステージングの管理画面で一覧を触って確認する",
                  "status": "todo",
                  "assignee": "d-kimuson",
                  "note": "PR が Ready になったら。",
                  "design": "rollout"
                },
                {
                  "id": "release-note",
                  "title": "リリースノートを書く",
                  "status": "todo",
                  "assignee": "claude",
                  "design": "rollout"
                }
              ],
              "outputs": [
                {
                  "id": "pr",
                  "label": "#1284 注文一覧を cursor ページングにする",
                  "href": "https://github.com/example/shop/pull/1284",
                  "kind": "PR",
                  "description": "Draft。Q1 が決まり次第 Ready にする。"
                },
                {
                  "id": "design-doc",
                  "label": "ページング方式の比較メモ",
                  "href": "docs/paging.md",
                  "kind": "Doc"
                },
                {
                  "id": "bench",
                  "label": "計測結果（10 万件）",
                  "href": "https://github.com/example/shop/actions/runs/9120",
                  "kind": "CI"
                },
                {
                  "id": "handler",
                  "href": "src/api/orders/list.ts"
                },
                {
                  "id": "migration",
                  "href": "db/migrate/20260925_add_orders_cursor_index.sql"
                }
              ],
              "questions": [
                {
                  "id": "legacy",
                  "title": "旧パラメータ page / per_page はどう扱いますか？",
                  "description": "管理画面の切り替えをこの PR に含めるかが変わる。",
                  "blocking": true,
                  "assumption": "当面は両方受け付け、次のリリースで 400 を返す"
                },
                {
                  "id": "deadline",
                  "title": "いつまでにマージできれば助かりますか？",
                  "description": "リリースの予定に合わせて、提案の index 追加を今回に含めるか決めたい。",
                  "blocking": true
                },
                {
                  "id": "limit",
                  "title": "1 ページの上限件数はいくつにしますか？",
                  "description": "管理画面は今 50 件ずつ表示している。",
                  "assumption": "100 件（CSV 出力でも使える大きさ）"
                },
                {
                  "id": "cursor-ttl",
                  "title": "cursor に有効期限は要りますか？",
                  "assumption": "期限は付けない。並びが変わっても次のページがずれるだけで済む"
                }
              ],
              "designs": [
                {
                  "id": "paging",
                  "title": "注文一覧のカーソルページング",
                  "body": "## 背景\n注文が 10 万件を超えた店舗で、管理画面の一覧の後ろのページが 2 秒近くかかる。offset 方式は深いページほど読み飛ばす行が増えるので、件数が増えるほど遅くなる。\n\n## 方針\n`GET /orders` のページングを cursor 方式に置き換える。並びは `created_at desc, id desc` で固定し、次のページは `next_cursor` で取る。\n\n- cursor は `(created_at, id)` を base64url で包んだ不透明な文字列\n- 旧パラメータ `page` / `per_page` の扱いは Q1 で決める\n- 1 ページの上限は 100 件（Q3 の仮回答）\n\n## 計測\n10 万件で深いページを取ると offset は 1.8 秒、cursor は 40 ms。比較は `docs/paging.md` にまとめた。"
                },
                {
                  "id": "rollout",
                  "title": "管理画面の切り替えとリリース",
                  "body": "## 移行\n新しい API を出したあと、管理画面の一覧を cursor 方式に切り替える。旧パラメータの扱いが決まるまで切り替えは保留する。\n\n## リスク\n- 同時刻の注文が多い日に並べ替えが遅くなる → 複合 index を提案\n- CSV 出力は offset のまま → cursor に合わせるかは別途判断"
                }
              ]
            }
          </script>
          <dpk-board-er-diagram
            id="orders-schema"
            slot="design:paging"
            heading="ERD"
            subject="ページングで読むテーブル"
            style="--diagram-height: 380px"
          >
            <script type="application/json">
              {
                "after": {
                  "tables": [
                    {
                      "id": "shops",
                      "name": "店舗",
                      "fields": [
                        { "id": "id", "type": "uuid", "key": "PK" },
                        { "id": "name", "type": "varchar" }
                      ]
                    },
                    {
                      "id": "orders",
                      "name": "注文",
                      "fields": [
                        { "id": "id", "type": "uuid", "key": "PK" },
                        { "id": "shop_id", "type": "uuid", "key": "FK", "ref": "shops.id" },
                        { "id": "created_at", "type": "timestamptz" },
                        { "id": "status", "type": "varchar" },
                        { "id": "total_amount", "type": "integer" }
                      ]
                    },
                    {
                      "id": "order_lines",
                      "name": "注文明細",
                      "fields": [
                        { "id": "id", "type": "uuid", "key": "PK" },
                        { "id": "order_id", "type": "uuid", "key": "FK", "ref": "orders.id" },
                        { "id": "sku", "type": "varchar" },
                        { "id": "quantity", "type": "integer" }
                      ]
                    }
                  ]
                }
              }
            </script>
          </dpk-board-er-diagram>
          <dpk-board-sequence-diagram
            id="cursor-flow"
            slot="design:paging"
            heading="Sequence"
            subject="次のページを取る"
          >
            <script type="application/json">
              {
                "participants": [
                  { "id": "admin", "name": "管理画面", "symbol": "UI" },
                  { "id": "api", "name": "Order API" },
                  { "id": "db", "name": "orders", "symbol": "DB" }
                ],
                "items": [
                  { "kind": "message", "id": "first", "from": "admin", "to": "api", "title": "GET /orders?limit=100" },
                  {
                    "kind": "message",
                    "id": "query",
                    "from": "api",
                    "to": "db",
                    "title": "WHERE (created_at, id) < cursor ORDER BY created_at DESC, id DESC"
                  },
                  {
                    "kind": "message",
                    "id": "rows",
                    "from": "db",
                    "to": "api",
                    "title": "101 行",
                    "style": "response"
                  },
                  {
                    "kind": "message",
                    "id": "page",
                    "from": "api",
                    "to": "admin",
                    "title": "items[100] + next_cursor",
                    "style": "response"
                  },
                  {
                    "kind": "message",
                    "id": "next",
                    "from": "admin",
                    "to": "api",
                    "title": "GET /orders?cursor=next_cursor"
                  }
                ]
              }
            </script>
          </dpk-board-sequence-diagram>
        </dpk-view-task-board></dpk-page
      >
    </dpk-app>
  </body>
</html>
