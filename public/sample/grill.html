<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Visually Grill — 注文キャンセル | dev-process-kit</title>
    <!--
      The framework is served by the Workers Static Assets dev server, not by
      this page's own origin: the sample server is a separate origin on purpose,
      so the cross-origin (CORS) load is exercised locally too.
    -->
    <script type="module" src="/dev-process-kit@debug/templates/grill.js"></script>
    <script type="module" src="/dev-process-kit@debug/components.js"></script>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #ffffff;
      }
      artifact-grill {
        display: block;
        height: 100dvh;
      }

      /* Everything below is author content inside slot="main". */
      .intro {
        max-width: 860px;
        color: #4d5566;
        font-size: 12.5px;
        line-height: 1.95;
      }
      .intro h2 {
        margin: 0 0 6px;
        color: #1a1d24;
        font-size: 15px;
        letter-spacing: -0.01em;
      }
      .intro p {
        margin: 0 0 10px;
      }
      .intro code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11.5px;
      }
      .block {
        margin-top: 24px;
      }
      .block h3 {
        display: flex;
        align-items: baseline;
        gap: 9px;
        margin: 0 0 8px;
        color: #1a1d24;
        font-size: 13.5px;
      }
      .block h3 span {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 10px;
        color: #7c8599;
      }
    </style>
  </head>
  <body>
    <artifact-grill storage-key="sample-grill-cancel">
      <script type="application/json">
        {
          "title": "新機能: 注文のセルフキャンセル",
          "questions": [
            {
              "id": "deadline",
              "ref": "Q1",
              "title": "キャンセルの締め切りはどこに置く？",
              "description": "お客様がいつまで自分でキャンセルできるかを決めます。締め切りの判定と出荷指示が競合しないことが前提です。",
              "note": "キャンセルと出荷指示が同じ瞬間に来たら、どちらが勝つ？",
              "options": [
                {
                  "id": "before-dispatch",
                  "label": "出荷指示が出る前まで（出荷指示と同じトランザクションで判定する）"
                },
                { "id": "hours-before", "label": "出荷予定の N 時間前まで（倉庫の作業に余裕を残す）" }
              ]
            },
            {
              "id": "refund-timing",
              "ref": "Q2",
              "title": "返金はキャンセル API の中で完了させる？",
              "description": "返金は外部の決済代行を呼ぶため、失敗やタイムアウトがあり得ます。お客様への応答を返金の結果に縛るかを決めます。オペレーターが承認する案は、人手が律速になり出荷前に間に合わないため外しています。",
              "note": "決済代行が 30 秒応答しなかったら、お客様の画面には何が出る？",
              "options": [
                { "id": "pending", "label": "注文を「返金待ち」にして 202 で即応答し、返金はワーカーで進める" },
                { "id": "sync", "label": "API の中で決済代行を呼び、返金まで完了させてから応答する" }
              ]
            },
            {
              "id": "refund-record",
              "ref": "Q3",
              "title": "返金の記録はどこに持つ？",
              "description": "返金の試行と結果を、注文とは別の概念として持つかを決めます。",
              "options": [
                { "id": "own-table", "label": "返金テーブルを新設し、1 回の返金を 1 行で持つ" },
                { "id": "order-columns", "label": "注文に返金額と refunded_at の列を足す" }
              ]
            },
            {
              "id": "idempotency-key",
              "ref": "Q4",
              "title": "返金の冪等キーは何にする？",
              "description": "再試行しても二重に返金しないためのキーを決めます。今回は注文の全額キャンセルだけを扱い、一部キャンセルはスコープ外です。",
              "note": "再試行のたびに新しいキーを作ると、二重返金になる。",
              "options": [
                { "id": "order-id", "label": "注文 ID（1 注文につき返金は 1 回）" },
                { "id": "refund-id", "label": "返金ごとに発行する ID（再試行では同じ ID を使う）" }
              ]
            },
            {
              "id": "release-timing",
              "ref": "Q5",
              "title": "在庫の引当はいつ解除する？",
              "description": "早く戻せば販売機会が増えますが、「返金待ち」の注文が出荷されないことが前提になります。",
              "options": [
                { "id": "on-refund", "label": "返金の完了を受けて解除する" },
                { "id": "on-accept", "label": "キャンセルを受け付けた時点で解除する" }
              ]
            },
            {
              "id": "refund-failure",
              "ref": "Q6",
              "title": "返金が失敗し続けたらどうする？",
              "description": "決済代行の障害が長引いたときに、注文をどの状態に置き、誰が気づくかを決めます。",
              "options": [
                { "id": "keep-pending", "label": "「返金待ち」のまま再試行を続け、一定時間を過ぎたらアラートを上げる" },
                { "id": "manual", "label": "一定回数で「オペレーター対応」の状態に移し、人が返金する" }
              ]
            }
          ]
        }
      </script>

      <!--
        The main area is free author markup. The `questions` fields inside the two
        diagrams' data put Q badges on the exact table, field and message each
        question is about.
      -->
      <div slot="main">
        <section class="intro">
          <h2>注文のセルフキャンセル</h2>
          <p>
            いまキャンセルは問い合わせ経由でオペレーターが手作業で取り消しており、出荷に間に合わないことがある。これを購入者が画面から取り消せるようにしたい。キャンセルは注文の中で閉じず、決済（返金）と在庫（引当の解除）をまたぐ。返金は外部の決済代行を呼ぶので、失敗やタイムアウトがあり得る。
          </p>
        </section>

        <section class="block">
          <h3>スキーマの変更案</h3>
          <artifact-er-diagram id="cancel-schema" heading="ERD" subject="注文と返金" style="--diagram-height: 560px">
            <script type="application/json">
              {
                "before": {
                  "tables": [
                    {
                      "id": "customers",
                      "name": "顧客",
                      "tags": ["顧客"],
                      "fields": [
                        { "id": "id", "type": "uuid", "key": "PK" },
                        { "id": "email", "type": "varchar", "key": "UQ" }
                      ]
                    },
                    {
                      "id": "orders",
                      "name": "注文",
                      "tags": ["注文"],
                      "fields": [
                        { "id": "id", "type": "uuid", "key": "PK" },
                        { "id": "customer_id", "type": "uuid", "key": "FK", "ref": "customers.id" },
                        { "id": "status", "type": "varchar" },
                        { "id": "total_amount", "type": "integer" },
                        { "id": "paid_at", "type": "timestamptz", "nullable": true }
                      ]
                    },
                    {
                      "id": "order_lines",
                      "name": "注文明細",
                      "tags": ["注文"],
                      "fields": [
                        { "id": "id", "type": "uuid", "key": "PK" },
                        { "id": "order_id", "type": "uuid", "key": "FK", "ref": "orders.id" },
                        { "id": "sku", "type": "varchar" },
                        { "id": "quantity", "type": "integer" },
                        { "id": "unit_price", "type": "integer" }
                      ]
                    }
                  ]
                },
                "after": {
                  "tables": [
                    {
                      "id": "customers",
                      "name": "顧客",
                      "tags": ["顧客"],
                      "fields": [
                        { "id": "id", "type": "uuid", "key": "PK" },
                        { "id": "email", "type": "varchar", "key": "UQ" }
                      ]
                    },
                    {
                      "id": "orders",
                      "name": "注文",
                      "tags": ["注文", "今回の設計"],
                      "fields": [
                        { "id": "id", "type": "uuid", "key": "PK" },
                        { "id": "customer_id", "type": "uuid", "key": "FK", "ref": "customers.id" },
                        { "id": "status", "type": "order_status", "questions": "Q2" },
                        { "id": "total_amount", "type": "integer" },
                        { "id": "paid_at", "type": "timestamptz", "nullable": true },
                        { "id": "cancelled_at", "type": "timestamptz", "nullable": true }
                      ]
                    },
                    {
                      "id": "order_lines",
                      "name": "注文明細",
                      "tags": ["注文"],
                      "fields": [
                        { "id": "id", "type": "uuid", "key": "PK" },
                        { "id": "order_id", "type": "uuid", "key": "FK", "ref": "orders.id" },
                        { "id": "sku", "type": "varchar" },
                        { "id": "quantity", "type": "integer" },
                        { "id": "unit_price", "type": "integer" }
                      ]
                    },
                    {
                      "id": "refunds",
                      "name": "返金",
                      "tags": ["返金", "今回の設計"],
                      "questions": "Q3",
                      "fields": [
                        { "id": "id", "type": "uuid", "key": "PK" },
                        { "id": "order_id", "type": "uuid", "key": "FK", "ref": "orders.id" },
                        { "id": "idempotency_key", "type": "varchar", "key": "UQ", "questions": "Q4" },
                        { "id": "amount", "type": "integer" },
                        { "id": "status", "type": "refund_status", "questions": "Q6" },
                        { "id": "completed_at", "type": "timestamptz", "nullable": true }
                      ]
                    }
                  ]
                }
              }
            </script>
          </artifact-er-diagram>
        </section>

        <section class="block">
          <h3>キャンセルから返金までの流れ（案）</h3>
          <artifact-sequence-diagram
            id="cancel-flow"
            heading="Sequence"
            subject="キャンセルから返金まで"
            style="--diagram-height: 820px"
          >
            <script type="application/json">
              {
                "participants": [
                  { "id": "customer", "name": "購入者", "role": "注文履歴の画面", "symbol": "UI" },
                  {
                    "id": "orders",
                    "name": "Order API",
                    "role": "注文コンテキスト",
                    "symbol": "API",
                    "description": "キャンセルの可否を判定し、注文の状態を持つ。"
                  },
                  { "id": "queue", "name": "Queue", "role": "イベント配送", "symbol": "QS" },
                  { "id": "refund", "name": "Refund worker", "role": "返金の実行", "symbol": "WK" },
                  {
                    "id": "payment",
                    "name": "決済代行",
                    "role": "外部サービス",
                    "kind": "external",
                    "symbol": "PS",
                    "description": "冪等キーで返金を重複排除する外部サービス。応答がタイムアウトすることがある。"
                  },
                  { "id": "stock", "name": "Stock API", "role": "在庫コンテキスト", "symbol": "INV" }
                ],
                "items": [
                  {
                    "kind": "message",
                    "id": "request",
                    "from": "customer",
                    "to": "orders",
                    "title": "POST /orders/{id}/cancel",
                    "tags": ["正常系"],
                    "guard": "購入者が注文詳細で「キャンセルする」を確認済み",
                    "detail": "二重送信では同じ受付結果を返す。"
                  },
                  {
                    "kind": "message",
                    "id": "check",
                    "from": "orders",
                    "to": "orders",
                    "title": "締め切り前かを判定",
                    "tags": ["正常系"],
                    "questions": "Q1",
                    "guard": "支払済みの注文",
                    "detail": "出荷指示と競合しないよう、判定と状態の更新を同じトランザクションで行う。"
                  },
                  {
                    "kind": "fragment",
                    "id": "accept-result",
                    "operator": "alt",
                    "title": "受付の可否",
                    "branches": [
                      {
                        "label": "締め切り前",
                        "items": [
                          {
                            "kind": "message",
                            "id": "to-pending",
                            "from": "orders",
                            "to": "orders",
                            "title": "refund_pending にしてイベントを記録",
                            "tags": ["正常系"],
                            "questions": "Q2",
                            "detail": "状態の更新と OrderCancelled の記録を同じトランザクションで行う（outbox）。"
                          },
                          {
                            "kind": "message",
                            "id": "publish",
                            "from": "orders",
                            "to": "queue",
                            "title": "OrderCancelled",
                            "style": "async",
                            "tags": ["正常系"]
                          },
                          {
                            "kind": "message",
                            "id": "accepted",
                            "from": "orders",
                            "to": "customer",
                            "title": "202 Accepted",
                            "style": "response",
                            "tags": ["正常系"],
                            "questions": "Q2",
                            "detail": "返金の結果は待たない。画面には「返金手続き中」と出す。"
                          }
                        ]
                      },
                      {
                        "label": "締め切り後",
                        "items": [
                          {
                            "kind": "message",
                            "id": "rejected",
                            "from": "orders",
                            "to": "customer",
                            "title": "409 Conflict",
                            "style": "response",
                            "tags": ["受付不可"],
                            "guard": "出荷指示が出ている",
                            "detail": "注文の状態は変えず、問い合わせ窓口を案内する。"
                          }
                        ]
                      }
                    ]
                  },
                  {
                    "kind": "message",
                    "id": "deliver",
                    "from": "queue",
                    "to": "refund",
                    "title": "OrderCancelled",
                    "style": "async",
                    "tags": ["非同期"]
                  },
                  {
                    "kind": "fragment",
                    "id": "refund-attempts",
                    "operator": "loop",
                    "title": "返金の試行",
                    "branches": [
                      {
                        "label": "結果が確定するまで",
                        "items": [
                          {
                            "kind": "message",
                            "id": "refund-request",
                            "from": "refund",
                            "to": "payment",
                            "title": "返金要求",
                            "tags": ["非同期"],
                            "questions": "Q4",
                            "guard": "返金の記録が未完了",
                            "detail": "冪等キーを付けて送り、再送しても二重に返金しない。"
                          },
                          {
                            "kind": "fragment",
                            "id": "refund-result",
                            "operator": "alt",
                            "title": "返金結果",
                            "branches": [
                              {
                                "label": "成功",
                                "items": [
                                  {
                                    "kind": "message",
                                    "id": "refund-ok",
                                    "from": "payment",
                                    "to": "refund",
                                    "title": "refunded",
                                    "style": "response",
                                    "tags": ["非同期"]
                                  },
                                  {
                                    "kind": "message",
                                    "id": "complete",
                                    "from": "refund",
                                    "to": "orders",
                                    "title": "RefundCompleted",
                                    "style": "async",
                                    "tags": ["非同期"],
                                    "detail": "注文を取消済みにし、cancelled_at を記録する。"
                                  },
                                  {
                                    "kind": "message",
                                    "id": "release",
                                    "from": "orders",
                                    "to": "stock",
                                    "title": "引当を解除",
                                    "style": "async",
                                    "tags": ["非同期"],
                                    "questions": "Q5",
                                    "detail": "注文 ID で冪等に解除する。"
                                  },
                                  {
                                    "kind": "message",
                                    "id": "notify",
                                    "from": "orders",
                                    "to": "customer",
                                    "title": "返金完了をメールで通知",
                                    "style": "async",
                                    "tags": ["非同期"]
                                  }
                                ]
                              },
                              {
                                "label": "タイムアウト",
                                "items": [
                                  {
                                    "kind": "message",
                                    "id": "inquire",
                                    "from": "refund",
                                    "to": "payment",
                                    "title": "結果を照会",
                                    "tags": ["再試行"],
                                    "guard": "決済代行の応答がタイムアウトし、結果が未確定",
                                    "detail": "返金済みなら成功として扱い、再送しない。"
                                  },
                                  {
                                    "kind": "message",
                                    "id": "reschedule",
                                    "from": "refund",
                                    "to": "queue",
                                    "title": "未処理なら再試行を予約",
                                    "style": "async",
                                    "tags": ["再試行"],
                                    "questions": "Q6",
                                    "detail": "間隔を空けて同じ冪等キーで再送する。失敗し続けたときの扱いは未定。"
                                  }
                                ]
                              }
                            ]
                          }
                        ]
                      }
                    ]
                  }
                ]
              }
            </script>
          </artifact-sequence-diagram>
        </section>
      </div>
    </artifact-grill>
  </body>
</html>
