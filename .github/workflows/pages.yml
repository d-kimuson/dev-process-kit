name: Pages

# Publishes the samples of `main` to GitHub Pages. They load the latest npm release from jsDelivr (`sample/kit.js`),
# or the one picked in each sample's header, so the site shows what a generated page gets; `main`'s markup may be ahead of it.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The samples need no build: they load the package from jsDelivr, never from the dev asset server.
      - name: Assemble the site
        run: |
          mkdir _site
          cp sample/*.html sample/*.js _site/
          if grep -l 'dev-process-kit\.localhost' _site/*.html; then
            echo 'a sample points at the dev asset server instead of loading through kit.js' >&2
            exit 1
          fi

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
